<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clueboard</title>
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="student">

<!-- No KaTeX in the markup, on purpose. Category names are plain text, and the one place this
     page draws maths is the clue card, which is only there when the teacher's cog has it on -
     so KaTeX, math.js and the board's font are fetched the first time a room asks for the
     card (clueKit), and a room that never does loads none of them. -->

<!-- The front page and the join screen are one screen, and have to be: the address students
     read off the board is this directory, built as new URL("./", location.href) by both
     board.html and control.html. So whatever is at / is what a student lands on with a code
     in their hand - which is why the code field gets the middle of the screen and the two
     links for everybody else get a corner each. -->
<main id="join" class="screen home">
  <h1>Clueboard</h1>

  <div class="entry">
    <div class="field">
      <label for="code">Room code</label>
      <!-- One field rather than four boxes: a single input already pastes, autofills, selects
           and backspaces, where four need scripting to do each of those worse. No
           autocomplete="one-time-code" - this code is read off a board, not texted, so that
           would only raise an SMS suggestion that never comes. No inputmode either: the code
           is letters, and the plain text keyboard is the right one. -->
      <!-- No maxlength, deliberately. It truncates what is typed or pasted before the filter
           below can drop the spaces and stray characters, so "WX YZ" arrived as "WXY" - the
           space used up the fourth slot and the Z was refused. asCode() caps at four after
           cleaning, which is the same limit applied in the right order.
           shortcut: a paste longer than the code keeps its first four letters, so pasting
           "room code WXYZ" tries ROOM. Pasting the bare code is the case that matters and a
           wrong code fails loudly; revisit if anyone actually hits it. -->
      <input id="code" autocapitalize="characters" autocomplete="off"
        spellcheck="false" enterkeyhint="go">
    </div>

    <p id="joinErr" class="err"></p>
    <button id="joinBtn">Join</button>
  </div>

  <footer class="corners">
    <a class="corner" href="control.html">Host a game</a>
    <a class="corner" href="designer.html">Designer</a>
  </footer>
  <p class="legal"><a href="privacy.html">Privacy and COPPA</a></p>
</main>

<main id="boot" class="screen" hidden>
  <p class="boot">Rejoining...</p>
</main>

<!-- Joining and being ready are two acts, not one. The code screen gets them into the room;
     everything a team wants to fuss over lives here, behind a Ready button. The point is the
     teacher's view: a team still picking a name looks nothing like a team that cannot get in,
     which is the thing that used to cost a walk across the room. Ready never gates the start -
     see route(). -->
<main id="lobby" class="screen" hidden>
  <header class="lobbyhead">
    <h2 id="lobbyTitle">Get ready</h2>
    <p class="lobbycode">Room <span id="lobbyCode"></span></p>
  </header>

  <div class="lobbyform">
    <div class="field">
      <label for="team">Team name</label>
      <input id="team" maxlength="40" autocomplete="off" enterkeyhint="next">
    </div>
    <div class="field">
      <label for="members">Team members (separate with commas)</label>
      <input id="members" maxlength="200" autocomplete="off" enterkeyhint="done"
        placeholder="Ada, Grace, Alan">
    </div>

    <!-- Off unless the teacher turns it on. Built once, on first show, from BUZZERS. -->
    <div class="field" id="buzzWrap" hidden>
      <label id="buzzLabel">Your buzzer</label>
      <div id="buzzGrid"></div>
    </div>
  </div>

  <p id="lobbyErr" class="err"></p>
  <p id="frozenNote" class="frozennote" hidden>Your setup has been locked</p>
  <button id="readyBtn">Ready</button>
</main>

<main id="play" class="screen" hidden>
  <div class="who">
    <span id="whoTeam"></span>
    <span id="playScore" class="score"></span>
    <button id="leave" class="leave" title="Change room">
      <span id="leaveIdle">Room <b id="whoCode"></b></span>
      <span id="leaveArm" hidden>Leave this room?</span>
    </button>
  </div>

  <!-- The clue on the projector, in the student's hand, when the cog has it on: the board's
       blue, its type and its edge, and the same words at the same moment. One card for the
       buzzer and the wager screens alike - show() moves it to whichever is up - so a Daily
       Double going from its wager to its clue keeps one card in one state. Without the
       setting it is not drawn at all. -->
  <div class="cluecard" id="clueCard" aria-live="polite">
    <div class="cluebody" id="cardBody">
      <div class="splash" id="cardSplash" hidden>
        <div class="splashtitle" id="cardTitle"></div>
        <div class="splashwho" id="cardSub"></div>
      </div>
      <p class="cluetext" id="cardText"></p>
      <p class="clueanswer" id="cardAnswer" hidden></p>
    </div>
  </div>

  <!-- The id is on the wrapper rather than the input: a buzzers-only game hides the box and
       the hint over it together, and CSS gives the button the space they leave. -->
  <div class="answerbox" id="answerWrap">
    <input id="answer" placeholder=" " autocomplete="off" enterkeyhint="done" maxlength="300">
    <div class="hint" aria-hidden="true">Type your answer</div>
  </div>

  <p id="playErr" class="err"></p>
  <button id="lock">Lock Answer</button>
</main>

<main id="pick" class="screen" hidden>
  <div class="who">
    <span id="pickWho"></span>
    <span id="pickScore" class="score"></span>
  </div>
  <h2 class="picktitle">Your pick</h2>
  <div id="pickGrid" class="pickgrid"></div>
  <p id="pickErr" class="err"></p>
</main>

<main id="wager" class="screen" hidden>
  <div class="who">
    <span id="wagerWho"></span>
    <span id="wagerScore" class="score"></span>
  </div>
  <h2 class="picktitle" id="wagerTitle">Daily Double</h2>
  <p class="wagercat" id="wagerCat"></p>

  <!-- The same shape as the answer screen above: one big box filling the screen and the
       lock bar under it, so a student who has used one already knows this one. It was a
       label, a short field and a button stacked at the top of an empty screen. -->
  <div class="answerbox wagerbox">
    <span class="cur" aria-hidden="true">$</span>
    <input id="wagerBox" placeholder=" " inputmode="numeric" autocomplete="off"
      enterkeyhint="done" maxlength="7" aria-label="Your wager">
    <div class="hint" aria-hidden="true">Up to <span id="wagerMax"></span></div>
  </div>

  <p id="wagerErr" class="err"></p>
  <button id="wagerBtn">Lock Wager</button>
</main>

<main id="wait" class="screen" hidden>
  <div class="who">
    <span id="waitWho"></span>
    <span id="waitScore" class="score"></span>
  </div>
  <p class="waitmsg" id="waitMsg"></p>
</main>

<!-- The end of the game. It used to be one grey sentence on the waiting screen, which is the
     screen that means "nothing to do" - so the finish of a whole lesson read as another lull.
     The board has the podiums; this is the same result in the student's hand. -->
<main id="results" class="screen" hidden>
  <div class="result">
    <p class="resultwho" id="resultWho"></p>
    <p class="resultscore" id="resultScore"></p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="demo.js"></script>
<script src="common.js"></script>
<!-- Our own file, not a dependency: it carries the wager cap and the rule for what the clue
     card shows, and one definition of each across the three screens beats three that can
     drift. KaTeX is not loaded here: see clueKit(). -->
<script src="clues.js"></script>
<!-- The room's colours, so thirty phones match the board. -->
<script src="theme.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const STORE = "clueboard-team";
const HOST_GONE = 60 * 60 * 1000;   // control screen shut this long: the game is over
// Four letters, uppercase, nothing else: the only shape a room code ever has. The URL, the
// box and the join all ask the same function, so there is one answer rather than three.
const asCode = (v) => v.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
const urlCode = asCode(new URL(location).searchParams.get("room") || "");

let teamRef = null;
let gameRef = null;
let myId = null;
let team = null;
let game = {};
let answerRound = null;     // which clue the answer box is currently for
let wagerRound = null;      // and the same for the wager box
let sending = null;         // "answer" | "wager" while a write is still in flight
let online = true;

// The clue card. Up here, with the rest of the state, because show() draws it and show() runs
// before the script below has finished.
//
// The board's own tempo, read off palette.css rather than copied, for the one move the card
// makes in script - the reveal. Read rather than repeated, so it cannot drift from the wall.
const rootStyle = getComputedStyle(document.documentElement);
const EASE = rootStyle.getPropertyValue("--ease").trim();
const SLOW = parseFloat(rootStyle.getPropertyValue("--slow"));
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const KIT_WAIT = 3000;          // how long a clue waits on KaTeX before it goes up raw
// The board's answer is set at 3.6vw under a 4.6vw clue (board.css), so the card's starts at
// the same proportion, and never above the clue's own size.
const ANSWER_SCALE = 3.6 / 4.6;
const MIN_TYPE = 12;            // px: below this the card clips rather than shrinking further
let cardKey = null;             // the clue on the card, keyed as renderClue() keys the board
let cardShown = null;           // what the card is showing of it, from cardFor()
let cardClose = null;           // the timer while a closed clue's words fade out
let cardWidth = 0;              // the width the words were last fitted at; 0 if never on screen
let kit = null;                 // KaTeX, math.js and the fonts, once a room has asked for them
let kitDone = false;
let held = null;                // { key, late, timer } while a clue waits on the kit

const saved = loadSaved();
$("#code").value = urlCode || (saved ? saved.code : "");

// The link wins: a different room in the URL means a fresh join, not the remembered team.
if (saved && (!urlCode || urlCode === saved.code)) {
  show("boot");
  roomState(saved.code).then((state) => {
    if (state === "over") {
      dropDeadRoom(saved.code, saved.teamId);
      show("join");
      return;
    }
    attach(saved.code, saved.teamId);
  });
} else {
  show("join");
}

$("#joinBtn").addEventListener("click", join);

// The box holds only ever what a code can be: anything else is dropped as it is typed rather
// than refused on submit, and the fourth letter moves on the way a passcode field does. Enter
// does the same at each step, so the form is reachable from the keyboard alone, and focus
// selects, so a student correcting a misread code types over it instead of appending.
$("#code").addEventListener("input", (e) => {
  const clean = asCode(e.target.value);
  if (clean !== e.target.value) e.target.value = clean;
  // The code is the only thing on this screen now, so the fourth letter moves to the one
  // button rather than to another box. Not a submit: a misread letter is common enough that
  // joining should stay a decision.
  if (clean.length === 4) $("#joinBtn").focus();
});
$("#code").addEventListener("focus", (e) => e.target.select());
$("#code").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });

$("#team").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#members").focus(); });
$("#members").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
$("#team").addEventListener("input", saveLobbySoon);
$("#members").addEventListener("input", saveLobbySoon);
// Whatever is half-typed when the box loses focus is sent at once: the debounce below is to
// spare the database thirty writes a word, not to hold anything back.
$("#team").addEventListener("blur", saveLobby);
$("#members").addEventListener("blur", saveLobby);
$("#readyBtn").addEventListener("click", toggleReady);
$("#leave").addEventListener("click", armLeave);
$("#lock").addEventListener("click", lockIn);
$("#answer").addEventListener("keydown", (e) => { if (e.key === "Enter") lockIn(); });
$("#wagerBtn").addEventListener("click", sendWager);
$("#wagerBox").addEventListener("keydown", (e) => { if (e.key === "Enter") sendWager(); });

// .info/connected is answered by the client itself, so the rules do not gate it. Without
// this a stuck write just sits on "Sending..." with no reason given.
db.ref(".info/connected").on("value", (snap) => {
  online = snap.val() === true;
  if (!sending) return;
  const box = sending === "wager" ? "#wagerErr" : "#playErr";
  $(box).textContent = online ? "" : "Offline - not sent yet. It will go when you reconnect.";
});

function show(which) {
  ["boot", "join", "lobby", "play", "pick", "wager", "wait", "results"].forEach((id) => {
    $("#" + id).hidden = id !== which;
  });
  // The card goes with the controls, straight under the name line. Only moved when it is
  // not already there: moving an element cancels whatever it is in the middle of, and this
  // runs on every snapshot, a buzz from across the room included.
  const card = $("#clueCard");
  const who = (which === "play" || which === "wager") && $("#" + which + " .who");
  if (who && who.nextElementSibling !== card) who.after(card);
  // After the screen is up rather than before, so a clue opening as this team leaves the
  // pick grid opens on screen instead of having happened already behind it.
  renderCard();
}

function roomState(code) {
  return hostSeenAge(code).then((age) =>
    age === null ? "unknown" : age > HOST_GONE ? "over" : "live");
}

function dropDeadRoom(code, teamId) {
  localStorage.removeItem(STORE);
  $("#code").value = urlCode || "";
  db.ref("rooms/" + code + "/teams/" + teamId).remove().catch(() => {});
}

function loadSaved() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
  return raw && raw.code && raw.teamId ? raw : null;
}

function join() {
  const code = asCode($("#code").value);
  if (!/^[A-Z]{4}$/.test(code)) { $("#joinErr").textContent = "Enter the 4-letter room code."; return; }

  $("#joinErr").textContent = "";
  $("#joinBtn").disabled = true;
  roomState(code)
    .then((state) => {
      if (state === "over") throw new Error("That game has ended. Ask for the new code.");
      // Anything but a live room: a typo, or a game that was cleared. Refusing here is what
      // stops a mistyped code looking exactly like a room nobody has started yet.
      if (state !== "live") throw new Error("No game with that code. Check the board.");
      const ref = db.ref("rooms/" + code + "/teams").push();
      // Exactly the four fields the create rule demands, and the name is deliberately blank:
      // naming happens in the lobby. Everywhere the team is shown to somebody else goes
      // through teamLabel(), so a nameless row reads as joining rather than as a gap.
      // score is left off - a missing score reads as 0 everywhere, so joining stays one write.
      return ref.set({ name: "", members: "", answer: "", locked: false }).then(() => {
        localStorage.setItem(STORE, JSON.stringify({ code: code, teamId: ref.key }));
        attach(code, ref.key);
      });
    })
    .catch((err) => { $("#joinErr").textContent = err.message; })
    .finally(() => { $("#joinBtn").disabled = false; });
}

function attach(code, teamId) {
  myId = teamId;
  teamRef = db.ref("rooms/" + code + "/teams/" + teamId);
  gameRef = db.ref("rooms/" + code + "/game");

  teamRef.on("value", (snap) => {
    team = snap.val();
    if (!team) {                       // team gone (teacher ended the game)
      toJoinScreen();
      return;
    }
    $("#whoTeam").textContent = team.name;
    $("#whoCode").textContent = code;
    $("#lobbyCode").textContent = code;
    $("#pickWho").textContent = team.name;
    $("#waitWho").textContent = team.name;
    $("#wagerWho").textContent = team.name;
    const s = money(team.score);
    $("#playScore").textContent = s;
    $("#pickScore").textContent = s;
    $("#waitScore").textContent = s;
    $("#wagerScore").textContent = s;     // the screen that needs the score most
    route();
  });

  gameRef.on("value", (snap) => {
    game = snap.val() || {};
    applyTheme(game.theme);
    route();
  });
}

// The buzzer is where a student device sits for a whole lesson, so it does not go anywhere:
// between clues it stays exactly where it is and goes dead. Three things take it off screen,
// and each of them is a thing to do rather than a thing to read - the grid when this team has
// the pick, somebody else's Daily Double, and the final clue's wager. With the clue card on,
// somebody else's Daily Double stays here too: it is on the card, so there is something to
// watch rather than a sentence to read.
//
// It used to be replaced by "Waiting for the next clue...", which is a sentence a student
// reads once and then stares at for the rest of the lesson. A control that is always in the
// same place and lights up when it works is less to learn than a screen that keeps changing.
function route() {
  if (!team) { show("join"); return; }
  // "Show the clue on student devices", in the cog. Everything it changes is under .clues in
  // style.css, so with it off this page is the page it always was.
  document.body.classList.toggle("clues", !!game.showClues);
  if (game.showClues) clueKit();
  // Drawn whether or not it is the screen on show, because it is where the router lands by
  // default and both listeners come through here.
  renderPlay();
  const clue = game.clue;

  // The game is over and the scores are on the board. Nothing left to do on a phone, so the
  // team's own name and final total get the screen to themselves rather than a dead buzzer.
  //
  // Not teamLabel(): its "Joining..." is written for the host's table and the board's welcome
  // list, where a team really is mid-join. At the end of the game it would be a lie.
  if (game.over) {
    $("#resultWho").textContent = team.name || "Your team";
    $("#resultScore").textContent = money(team.score || 0);
    show("results");
    return;
  }

  // Before the game starts, and for anyone who has not pressed Ready, the phone is a lobby
  // rather than a dead buzzer: the team settles its name, its members and its buzzer here,
  // and says when it is done. The rule is inLobby() in clues.js, where it is tested.
  if (inLobby(game, team)) { renderLobby(); show("lobby"); return; }

  if (clue) {
    // A Daily Double belongs to one team. myClue() is false for nothing else, so this is
    // always that: everyone else watches, and is told whose it is. With the clue card on
    // they watch it on the card instead, over their own buzzer gone dead - renderPlay()
    // says whose it is on the button.
    if (!myClue(clue)) {
      if (!game.showClues) {
        $("#waitMsg").textContent =
          (clue.ownerName || "Another team") + " has the Daily Double.";
        show("wait");
        return;
      }
    } else if (game.wagering) {
      // Off the wager screen the moment it is in. The screen was holding them on a dead
      // gold button until the slowest team in the room had finished typing, with nothing
      // saying why - which is what "it takes a long time to send" actually was.
      // Not until the server has it. Firebase fires a listener on the local write first,
      // so without the sending check the screen would say "locked" to a student whose wager
      // is still sitting on a school network.
      // With the clue card on it stays put instead, the box and the bar dead and saying so,
      // because the card is on this screen and the card is the thing to watch.
      if (hasWagered() && sending !== "wager" && !game.showClues) {
        $("#waitMsg").textContent = money(team.wager)
          + " wager locked. Waiting for the other teams...";
        show("wait");
        return;
      }
      renderWager(clue);
      show("wager");
      return;
    }
  } else if (game.turn === myId && (game.teamsPick || game.picker === myId)) {
    // The teacher paces the game and normally picks the clues themselves. A team only sees
    // the board when it has been handed to them for one pick, or when the teacher has turned
    // team picking on for the whole game.
    renderPick(); show("pick"); return;
  }

  show("play");
}

// Final is everyone's. A Daily Double is one team's, frozen onto the clue when it was opened
// so that the teacher awarding someone else mid-clue cannot hand it over.
function myClue(clue) {
  if (clue.final) return true;
  if (clue.dd) return clue.owner === myId;
  return true;
}

// Has this team's wager landed? The one place it is decided, because the router and the
// screen itself both ask.
function hasWagered() {
  return !!team && team.wager !== undefined && team.wager !== null;
}

function renderWager(clue) {
  const cap = wagerCap(team.score, game.grid, !!clue.final);

  // Clear on a new wager round only, never on a re-render: a score correction mid-typing
  // would otherwise wipe what the student has half entered.
  const round = clue.final ? "final" : clue.cat + "-" + clue.row;
  if (round !== wagerRound) {
    wagerRound = round;
    $("#wagerBox").value = "";
    $("#wagerErr").textContent = "";
  }

  $("#wagerTitle").textContent = clue.final ? "Final Clue" : "Daily Double";
  $("#wagerCat").textContent = clue.category || "";
  $("#wagerMax").textContent = money(cap);

  const box = $("#wagerBox");
  const btn = $("#wagerBtn");
  // Without the clue card there is no locked state to draw here: the moment a wager lands the
  // router takes the student to the waiting screen, which is the whole fix for how long this
  // used to feel. With the card on, the wager stays on screen, in the box it was typed in.
  const landed = hasWagered() && sending !== "wager";
  if (landed) box.value = Number(team.wager).toLocaleString("en-US");
  box.disabled = sending === "wager" || landed;
  btn.disabled = box.disabled;
  btn.textContent = sending === "wager" ? "Sending..." : landed ? "Wager locked" : "Lock Wager";
}

// A wager that is not a whole number, or is more than the team has, is refused with a
// reason rather than quietly turned into something else. It used to floor and clamp: "five
// hundred" locked in as $0 and 900 locked in as 600, both without a word, at the one moment
// of the game that is entirely about the number.
function sendWager() {
  if (!teamRef || !team || sending) return;
  const clue = game.clue || {};
  const cap = wagerCap(team.score, game.grid, !!clue.final);
  const typed = readWager($("#wagerBox").value);
  if (typed === null) {
    $("#wagerErr").textContent = $("#wagerBox").value.trim()
      ? "A wager is a whole number of dollars, like 500."
      : "Enter a wager, or 0.";
    return;
  }
  if (typed > cap) {
    $("#wagerErr").textContent = "That is more than you have. Your limit is "
      + money(cap) + ".";
    return;
  }
  $("#wagerErr").textContent = "";
  sending = "wager";
  renderWager(clue);
  teamRef.update({ wager: typed })
    .then(() => {
      sending = null;
      $("#wagerErr").textContent = "";   // an offline notice has no other way back down
      route();
    })
    .catch((err) => {
      sending = null;
      $("#wagerErr").textContent = err.message;
      renderWager(clue);
    });
}

// The board itself, in the shape the room is looking at: the same columns, the same rows,
// the same spent cells. It used to be a list, one row per category, which asked a student to
// find on their phone a thing they could already see on the wall - and read as a different
// game from the one being played. The cells are laid out exactly as board.html lays them.
function renderPick() {
  const grid = game.grid;
  const wrap = $("#pickGrid");
  wrap.textContent = "";
  if (!grid || !grid.cats) {
    $("#pickErr").textContent = "Waiting for the board...";
    return;
  }
  $("#pickErr").textContent = "";
  wrap.style.setProperty("--cols", grid.cats.length);   // the round's own size, as on the wall
  wrap.style.setProperty("--rows", (grid.values[0] || []).length);

  grid.cats.forEach((name, c) => {
    const head = document.createElement("div");
    head.className = "pickcat";
    head.style.gridColumn = c + 1;
    head.style.gridRow = 1;
    head.textContent = name;             // plain text by design: no maths in a category
    wrap.appendChild(head);

    (grid.values[c] || []).forEach((value, r) => {
      const spent = !value || (game.used || {})[(game.round || 1) + "-" + c + "-" + r];
      const b = document.createElement("button");
      b.className = "pickval" + (spent ? " spent" : "");
      b.style.gridColumn = c + 1;
      b.style.gridRow = r + 2;
      b.textContent = value ? money(value) : "";
      b.disabled = !!spent;
      if (!spent) b.addEventListener("click", () => sendPick(c, r));
      wrap.appendChild(b);
    });
  });
}

// Only a coordinate goes up. The control screen is the only thing that knows what the clue
// says, which is what keeps the answers off the network.
function sendPick(cat, row) {
  if (!gameRef) return;
  $("#pickErr").textContent = "";
  gameRef.child("pick").set({ team: myId, cat: cat, row: row })
    .catch((err) => { $("#pickErr").textContent = err.message; });
}

let leaveArmed = false;
let leaveTimer = null;
function armLeave() {
  if (!leaveArmed) {
    leaveArmed = true;
    $("#leaveIdle").hidden = true;
    $("#leaveArm").hidden = false;
    $("#leave").classList.add("arm");
    leaveTimer = setTimeout(disarmLeave, 4000);
    return;
  }
  clearTimeout(leaveTimer);
  disarmLeave();
  toJoinScreen();
}

function disarmLeave() {
  leaveArmed = false;
  $("#leaveIdle").hidden = false;
  $("#leaveArm").hidden = true;
  $("#leave").classList.remove("arm");
}

// ---------------------------- the lobby ----------------------------

let lobbyWrite = null;
let gridBuilt = false;

// Thirty Chromebooks writing on every keystroke is the thing to avoid; the teacher watching a
// name appear as it is typed is the thing to keep. A short debounce does both, and blur
// flushes it. Same shape as the theme writer on the control screen.
function saveLobbySoon() {
  clearTimeout(lobbyWrite);
  lobbyWrite = setTimeout(saveLobby, 400);
}

// The teacher's padlock is a pre-game tool - control.html only draws it before the start, so
// afterwards there is nobody left who can take it off. Letting it lapse at the start is what
// keeps a locked team that never pressed Ready from being shut out of the whole lesson.
function hostLocked() { return !!(team && team.frozen) && !game.started; }

function saveLobby() {
  clearTimeout(lobbyWrite);
  if (!teamRef || !team || hostLocked()) return;
  const name = $("#team").value.trim().slice(0, 40);
  const members = $("#members").value.trim().slice(0, 200);
  // The slices match database.rules.json, which rejects the write outright past them.
  if (name === (team.name || "") && members === (team.members || "")) return;
  teamRef.update({ name: name, members: members })
    .catch((err) => { $("#lobbyErr").textContent = "Not saved: " + err.message; });
}

function toggleReady() {
  if (!teamRef || !team || hostLocked()) return;
  const next = !team.ready;
  // Readying up with the name box still blank is the one thing worth refusing: an unnamed
  // team is exactly the one the teacher cannot do anything about from across the room.
  if (next && !$("#team").value.trim()) {
    $("#lobbyErr").textContent = "Team name required";
    $("#team").focus();
    return;
  }
  $("#lobbyErr").textContent = "";
  saveLobby();
  teamRef.update({ ready: next })
    .catch((err) => { $("#lobbyErr").textContent = "Not saved: " + err.message; });
}

function pickBuzzer(id) {
  if (!teamRef || !team || hostLocked()) return;
  // Picking is also what arms the AudioContext on this device, through the one-shot
  // pointerdown gate in common.js - so a team that chose a buzzer has working audio before
  // the first clue, rather than discovering it on the buzz that mattered.
  //
  // Silent while a clue is up: the grid is reachable mid-game now, and a late joiner tapping
  // through the tiles would sound every one across a room that is thinking. Audio is armed
  // by the tap either way, so the line above still holds.
  // shortcut: every sound is beep() until the real files land. One call site to change.
  if (!game.muted && !game.clue) beep();
  teamRef.update({ buzzer: id })
    .catch((err) => { $("#lobbyErr").textContent = "Not saved: " + err.message; });
}

function buildBuzzGrid() {
  if (gridBuilt) return;
  gridBuilt = true;
  const grid = $("#buzzGrid");
  BUZZERS.forEach((g) => {
    const head = document.createElement("p");
    head.className = "buzzgroup";
    head.textContent = g.group;
    grid.appendChild(head);
    const row = document.createElement("div");
    row.className = "buzzrow";
    g.sounds.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "buzztile";
      b.dataset.id = s.id;
      b.textContent = s.label;
      b.addEventListener("click", () => pickBuzzer(s.id));
      row.appendChild(b);
    });
    grid.appendChild(row);
  });
}

// A box the student is typing in is never written over - not by their own keystroke coming
// back off the database a moment later, and not by the teacher editing the same field.
function setIfIdle(el, value) {
  if (document.activeElement !== el) el.value = value;
}

function renderLobby() {
  const frozen = hostLocked();
  const ready = !!team.ready;

  setIfIdle($("#team"), team.name || "");
  setIfIdle($("#members"), team.members || "");

  $("#buzzWrap").hidden = !game.buzzerPick;
  if (game.buzzerPick) {
    buildBuzzGrid();
    [].forEach.call($("#buzzGrid").querySelectorAll(".buzztile"), (b) => {
      b.classList.toggle("on", b.dataset.id === team.buzzer);
      b.disabled = frozen;
    });
  }

  $("#team").disabled = frozen;
  $("#members").disabled = frozen;
  $("#frozenNote").hidden = !frozen;
  // A team that lands here mid-game is not getting ready, it is late: say the one thing it
  // has to do, and make the button the way in rather than another thing to be ready for.
  $("#lobbyTitle").textContent = ready ? "Ready"
    : !game.started ? "Get ready"
    : team.name ? "The game has started"
    : "Name your team";

  const btn = $("#readyBtn");
  btn.disabled = frozen;
  btn.classList.toggle("unready", ready);
  btn.textContent = frozen ? (ready ? "Ready" : "Waiting for the host")
    : ready ? "Ready - change it"
    : game.started ? "Join the game"
    : "Ready";
}

// Leaves the team in the database on purpose: the teacher keeps the row, the score and any
// locked answer, and can drop it with the x beside its row.
function toJoinScreen() {
  if (teamRef) { teamRef.off(); teamRef = null; }
  if (gameRef) { gameRef.off(); gameRef = null; }
  localStorage.removeItem(STORE);
  myId = null;
  team = null;
  game = {};
  answerRound = null;
  wagerRound = null;
  $("#answerWrap").hidden = false;
  $("#answer").disabled = false;
  $("#answer").value = "";
  $("#lock").disabled = false;
  $("#lock").textContent = "Lock Answer";
  $("#playErr").textContent = "";
  $("#wagerBox").value = "";
  $("#wagerBox").disabled = false;
  $("#wagerBtn").disabled = false;
  $("#wagerErr").textContent = "";
  clearTimeout(lobbyWrite);
  $("#team").value = "";
  $("#team").disabled = false;
  $("#members").value = "";
  $("#members").disabled = false;
  $("#readyBtn").disabled = false;
  $("#lobbyErr").textContent = "";
  $("#code").value = "";
  show("join");
}

// Written answers can be off for a whole game, in which case the buzzer is the only control
// and teams answer out loud. The final clue is the exception the setting carries: every team
// answers that one at the same time, so there is nobody to say it to.
function typingOn() {
  return !game.buzzersOnly || !!(game.clue && game.clue.final);
}

// The one place the buzzer screen is drawn, in the three states the room puts it in: a clue
// is open and it takes an answer, this team has already locked one in, or there is no clue
// and both controls are dead. Dead rather than gone - see route().
function renderPlay() {
  const box = $("#answer");
  const btn = $("#lock");
  const typing = typingOn();
  // Somebody else's Daily Double, which with the clue card on this team watches from here.
  const theirs = !!game.clue && !myClue(game.clue);
  const live = !!game.clue && !game.wagering && !game.reveal && !theirs;
  // Optimistic: Firebase fires a listener on the local write before the server has it, so
  // the press has to show as locked on its own rather than waiting for the echo.
  const locked = !!(team && team.locked) || sending === "answer";

  $("#answerWrap").hidden = !typing;
  box.disabled = !live || locked;
  btn.disabled = !live || locked;

  // Cleared when the clue changes, not when the lock is released: a score correction
  // mid-typing used to be the only re-render that could wipe a half-typed answer, and the
  // host's reset only ever reaches a team that locked something in - a student who typed and
  // never locked carried it into the next question.
  const round = !live ? null : game.clue.final ? "final" : game.clue.cat + "-" + game.clue.row;
  if (round !== answerRound) {
    answerRound = round;
    box.value = "";
    $("#playErr").textContent = "";
  }
  // Empty until the write echoes back, and the box already holds what was typed.
  if (locked && team && team.answer) box.value = team.answer;

  // Grey like any dead bar, not red: red only ever takes something away, and nothing has been.
  btn.textContent = sending === "answer" ? "Sending..."
    : theirs ? (game.clue.ownerName || "Another team") + "'s Daily Double"
    : locked ? (typing ? "Locked in" : "Buzzed in")
    : (typing ? "Lock Answer" : "Buzz In");
}

// Firebase applies a write locally and fires listeners before the server has seen it, so a
// snapshot alone cannot tell a student their answer arrived. On a school network that is the
// difference between "Locked in" and the teacher marking the round without them.
function lockIn() {
  if (!teamRef || sending) return;
  // The real guard on a buzz, rather than trusting that the button was disabled: between
  // clues there is nothing to ring in to, and a write here would put a team in the order for
  // a question that is not open. Once revealed, the answer is on the projector - a buzz
  // after that is a team copying it down, so the clue is closed to new answers even though
  // it is still on screen. reveal is cleared by every route out of a clue. And another team's
  // Daily Double is theirs alone: with the clue card on, this team watches it from the buzzer
  // screen, and this line - not the dead button - is what keeps a buzz out of it.
  if (!game.clue || game.wagering || game.reveal || !myClue(game.clue)) return;
  const typing = typingOn();
  const answer = $("#answer").value.trim();
  if (typing && !answer) return;       // empty box does nothing; with no box, the buzz is all
  // Muting is the room's, not the device's: the teacher turns it off once and thirty
  // Chromebooks go quiet, which is the only version of this setting that is any use in a
  // lesson. It still beeps for the tap, not for the delivery.
  if (!game.muted) beep();
  sending = "answer";
  renderPlay();
  teamRef.update({ answer: typing ? answer : "", buzzedAt: SERVER_TIME, locked: true })
    .then(() => {
      sending = null;
      $("#playErr").textContent = "";
      renderPlay();
    })
    .catch((err) => { sending = null; $("#playErr").textContent = err.message; });
}

// ---------------------------- the clue card ----------------------------

// The clue on the projector, in the student's hand: it arrives when the board's does and
// moves the way the board moves, but the card itself never moves. Its place and its size are
// fixed the moment the setting is on, so nothing under a thumb shifts when a clue arrives -
// the card is a dark spent tile between clues and fills with board blue when one opens.
//
// Keyed on the clue as renderClue() keys the board, so the snapshots a buzz or a score sends
// mid-clue are the same card and never restart a move. Drawn from show(), on every snapshot.
function renderCard() {
  // typeof as well: for ten minutes after a deploy a phone can hold the old clues.js beside
  // this page, and then the card waits for a reload instead of taking the buzzer down with it.
  if (!game.showClues || typeof cardFor !== "function") { if (cardKey) clearCard(); return; }
  const card = cardFor(game, myId);
  if (card.kind === "empty") {
    if (cardKey && !cardClose) closeCard();
    return;
  }
  // A new clue, or the same one opened again while its close was still fading out.
  if (card.key !== cardKey || cardClose) {
    if (!kitDone && !kitLate(card.key)) return;
    openCard(card);
  } else {
    updateCard(card);
  }
  // A card filled while its screen was hidden - a team in the lobby as the clue opened - is
  // fitted the first time it is on screen.
  if ($("#clueCard").clientWidth !== cardWidth) fitCard();
}

// A clue arriving. The card goes from spent to board blue over the board's beat, standing in
// for the board's panel growing out of its cell, and the words fade in over the back of it so
// they are fully there exactly as that panel stops. The fade is held off in CSS rather than
// fired by a timer, as the intro's title card is, so it runs on the same clock as the colour.
// The final clue opens the same way here, although the board's cuts in with no cell to grow
// from.
function openCard(card) {
  const el = $("#clueCard");
  // Everything a close left behind goes first, the reveal's transform and opacity included:
  // a clue that inherited those would start invisible. And straight back to spent, rather
  // than fading back up from wherever the close had got to.
  clearCard();
  el.classList.add("snap");
  cardKey = card.key;
  fillCard(card);                       // and fitted, while the words are still invisible
  if (card.answer) showAnswer(card.answer, false);
  void el.offsetWidth;                  // the spent card, committed before it opens
  el.classList.remove("snap");
  el.classList.add("open");
  // The Daily Double arrives with weight, as on the board. clearCard() took the class off,
  // and the reflow above is what lets it run again on an element that is reused.
  if (card.kind === "title" && game.clue.dd) $("#cardSplash").classList.add("punch");
}

// The same clue, moved on: the splash giving way to the clue once the wagers are in, which
// the board does as a cut and so does this, or the answer going up.
function updateCard(card) {
  const was = cardShown;
  if (card.kind !== was.kind || card.title !== was.title || card.sub !== was.sub
      || card.text !== was.text) {
    fillCard(card);
  }
  if (card.answer && !cardShown.answer) showAnswer(card.answer, true);
  else if (!card.answer && cardShown.answer) hideAnswer();
}

function fillCard(card) {
  const title = card.kind === "title";
  $("#cardSplash").hidden = !title;
  if (!title) $("#cardSplash").classList.remove("punch");
  $("#cardTitle").textContent = title ? card.title : "";
  $("#cardSub").textContent = title ? card.sub : "";   // a category or a team: never maths
  $("#cardText").hidden = title;
  if (title) $("#cardText").textContent = "";
  else words($("#cardText"), card.text);
  hideAnswer();
  cardShown = { kind: card.kind, title: card.title, sub: card.sub, text: card.text, answer: "" };
  fitCard();
  // A face the warm-up never asked for - a rarer KaTeX one - is still on its way. Fitted
  // again when it lands; the words are held invisible for the first 600ms, which is usually
  // longer than that takes.
  if (document.fonts.status === "loading") document.fonts.ready.then(fitCard);
}

// The answer going up is the beat of the whole card, as it is of the board's: the clue eases
// up out of the way while the answer and its rule fade in underneath, over the same span, so
// they are fully there exactly as the clue comes to rest. openAnswer() in board.html - a
// FLIP, transform and opacity only - with one mover, because a card carries no picture. The
// answer is fitted into the room under the clue before the "after" is measured, so the clue
// keeps its size and only moves. Unmoved when the card opens on a clue already revealed.
function showAnswer(text, move) {
  const clue = $("#cardText");
  const ans = $("#cardAnswer");
  const before = clue.getBoundingClientRect().top;
  words(ans, text);
  ans.style.transition = "none";
  ans.style.opacity = move ? "0" : "1";
  ans.hidden = false;
  cardShown.answer = text;
  fitAnswer();
  if (!move) return;

  clue.style.transition = "none";
  clue.style.transform = "translateY(" + (before - clue.getBoundingClientRect().top) + "px)";
  void ans.offsetWidth;
  clue.style.transition = "transform " + SLOW + "ms " + EASE;
  clue.style.transform = "translateY(0)";
  // Linear against an eased move: the fade is steady the whole way and the clue is what
  // slows down, which is the half the eye follows.
  ans.style.transition = "opacity " + SLOW + "ms linear";
  ans.style.opacity = "1";
}

function hideAnswer() {
  const ans = $("#cardAnswer");
  ans.hidden = true;
  ans.textContent = "";
  ans.style.cssText = "";
  $("#cardText").style.cssText = "";
  if (cardShown) cardShown.answer = "";
}

// Back to a spent tile: the words fade out over the board's beat, linearly, as its panel
// fades on the way back to its cell, and only then come off the card.
function closeCard() {
  $("#clueCard").classList.remove("open");
  cardClose = setTimeout(clearCard, reduced.matches ? 0 : SLOW);
}

function clearCard() {
  clearTimeout(cardClose);
  cardClose = null;
  $("#clueCard").classList.remove("open");
  $("#cardSplash").classList.remove("punch");
  $("#cardSplash").hidden = true;
  $("#cardTitle").textContent = "";
  $("#cardSub").textContent = "";
  $("#cardText").textContent = "";
  hideAnswer();
  cardKey = null;
  cardShown = null;
}

// The board sizes its clue in CSS alone, and a card in the hand is too small for that, so
// this measures - while the words are invisible, so nothing is seen changing size. The type
// steps down a twentieth at a time, fitRows()' method on the dashboard, until the words fit
// with an answer's line still free under the clue; then the answer, if it is up, gets that
// room. The clue's size never depends on its answer, which is what lets the reveal only move
// it.
function fitCard() {
  const el = $("#clueCard");
  const body = $("#cardBody");
  const ans = $("#cardAnswer");
  const room = cardRoom();
  cardWidth = el.clientWidth;
  if (!cardShown || !room) return;      // not on screen: fitted when it is

  // The free line is the answer element itself, holding one letter at its starting size, so
  // the room it keeps is exactly what a one-line answer will take. Put back before any paint.
  const kept = Array.prototype.slice.call(ans.childNodes);
  const wasHidden = ans.hidden;
  const fontWas = ans.style.fontSize;
  if (cardShown.kind === "clue") {
    ans.textContent = "X";
    ans.style.fontSize = ANSWER_SCALE + "em";
    ans.hidden = false;
  }
  const top = Math.min(room.w / 7, room.h / 5);
  for (let k = 20; k > 0; k--) {
    body.style.fontSize = top * k / 20 + "px";
    if (fits(room) || top * (k - 1) / 20 < MIN_TYPE) break;
  }
  ans.textContent = "";
  kept.forEach((n) => ans.appendChild(n));
  ans.hidden = wasHidden;
  ans.style.fontSize = fontWas;
  if (!ans.hidden) fitAnswer();
}

// The answer, into whatever the clue left, starting at the board's proportion to it.
function fitAnswer() {
  const ans = $("#cardAnswer");
  const room = cardRoom();
  if (!room) return;
  const clue = parseFloat($("#cardBody").style.fontSize) || 0;
  for (let k = 20; k > 0; k--) {
    ans.style.fontSize = ANSWER_SCALE * k / 20 + "em";
    if (fits(room) || clue * ANSWER_SCALE * (k - 1) / 20 < MIN_TYPE) break;
  }
}

// The card's content box, or null while it is not on screen.
function cardRoom() {
  const el = $("#clueCard");
  const cs = getComputedStyle(el);
  const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  return w > 0 && h > 0 ? { w: w, h: h } : null;
}

// Height is the column of words against the card. Width catches what wrapping cannot: one
// long word, or an expression KaTeX will not break.
function fits(room) {
  const body = $("#cardBody");
  return body.offsetHeight <= room.h + 1 && body.scrollWidth <= room.w + 1;
}

// The teacher's own text, through KaTeX once it is here. A student with devtools can write
// to game/clue too, and that can deface the card but never script it: KaTeX runs with its
// default trust: false, and anything that is not maths goes in as textContent. Raw if
// math.js never arrived.
function words(el, text) {
  if (window.mathText) mathText(el, text);
  else el.textContent = text;
}

// KaTeX (275 KB), math.js and the board's font, fetched the first time a room asks for the
// card - normally in the lobby, long before the first clue - and cached after that. A room
// that never turns the card on loads none of it.
function clueKit() {
  if (kit) return;
  const add = (el) => new Promise((done) => {
    el.onload = el.onerror = done;
    document.head.appendChild(el);
  });
  const sheet = document.createElement("link");
  sheet.rel = "stylesheet";
  sheet.href = "katex/katex.min.css";
  const script = (src) => {
    const s = document.createElement("script");
    s.src = src;
    return add(s);
  };
  kit = Promise.all([add(sheet), script("katex/katex.min.js"), script("math.js")])
    .then(warmFonts)
    .then(() => { kitDone = true; renderCard(); });
}

// The first clue is measured in the fonts it will be drawn in, so they are fetched now, by a
// sample nobody sees, rather than by the clue itself: Anton, and the KaTeX faces the year's
// maths uses.
function warmFonts() {
  const sample = document.createElement("p");
  sample.style.cssText = "position:absolute;visibility:hidden;font:700 20px Anton";
  words(sample, "A $\\frac{x}{4} + \\sqrt{2} \\times \\pi^2 \\le 180^\\circ$");
  document.body.appendChild(sample);
  void sample.offsetWidth;              // laid out, which is what starts the fetches
  return document.fonts.ready.then(() => sample.remove());
}

// A clue that lands before the kit waits for it, a few seconds at most, so a clue never goes
// up raw and then turns into maths in front of the student. Past that it goes up raw.
function kitLate(key) {
  if (!held || held.key !== key) {
    if (held) clearTimeout(held.timer);
    const h = held = { key: key, late: false };
    h.timer = setTimeout(() => { h.late = true; renderCard(); }, KIT_WAIT);
  }
  return held.late;
}

// Turned on its side, the phone has a different card, so the words are fitted again. A
// change in height alone with a box focused is the soft keyboard coming up, and the card
// clips rather than reflowing under the student's thumbs.
let fitWidth = innerWidth;
let fitTimer = null;
addEventListener("resize", () => {
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (innerWidth === fitWidth && typing) return;
  fitWidth = innerWidth;
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitCard, 150);
});
</script>
</body>
