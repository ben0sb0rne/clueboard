<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clueboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="student">

<!-- No KaTeX here, on purpose. Category names are plain text and the clue itself is on the
     projector, so the player screen stays dependency-free. -->

<main id="join" class="screen">
  <h1>Clueboard</h1>

  <div class="field">
    <label for="code">Room code</label>
    <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="team">Team name</label>
    <input id="team" maxlength="40" autocomplete="off">
  </div>
  <div class="field">
    <label for="members">Team members (separate with commas)</label>
    <input id="members" maxlength="200" autocomplete="off" placeholder="Ada, Grace, Alan">
  </div>

  <p id="joinErr" class="err"></p>
  <button id="joinBtn">Join</button>
</main>

<main id="boot" class="screen" hidden>
  <p class="boot">Rejoining...</p>
</main>

<main id="play" class="screen" hidden>
  <div class="who">
    <span id="whoTeam"></span>
    <button id="leave" class="leave" title="Change room">
      <span id="leaveIdle">Room <b id="whoCode"></b></span>
      <span id="leaveArm" hidden>Tap again to leave</span>
    </button>
  </div>

  <div class="answerbox">
    <input id="answer" placeholder=" " autocomplete="off" enterkeyhint="done" maxlength="300">
    <div class="hint" aria-hidden="true">Type your answer</div>
  </div>

  <p id="playErr" class="err"></p>
  <button id="lock">Lock Answer</button>
</main>

<main id="pick" class="screen" hidden>
  <div class="who">
    <span id="pickWho"></span>
    <span id="pickScore" class="score"></span>
  </div>
  <h2 class="picktitle">Your pick</h2>
  <div id="pickList" class="picklist"></div>
  <p id="pickErr" class="err"></p>
</main>

<main id="wait" class="screen" hidden>
  <div class="who">
    <span id="waitWho"></span>
    <span id="waitScore" class="score"></span>
  </div>
  <p class="waitmsg" id="waitMsg">Waiting for the next clue...</p>
</main>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="demo.js"></script>
<script src="common.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const STORE = "clueboard-team";
const HOST_GONE = 60 * 60 * 1000;   // control screen shut this long: the game is over
const urlCode = (new URL(location).searchParams.get("room") || "")
  .toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);

let teamRef = null;
let gameRef = null;
let myId = null;
let team = null;
let game = {};
let wasLocked = false;

const saved = loadSaved();
$("#code").value = urlCode || (saved ? saved.code : "");

// The link wins: a different room in the URL means a fresh join, not the remembered team.
if (saved && (!urlCode || urlCode === saved.code)) {
  show("boot");
  roomState(saved.code).then((state) => {
    if (state === "over") {
      dropDeadRoom(saved.code, saved.teamId);
      show("join");
      return;
    }
    attach(saved.code, saved.teamId);
  });
} else {
  show("join");
}

$("#joinBtn").addEventListener("click", join);
$("#members").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
$("#leave").addEventListener("click", armLeave);
$("#lock").addEventListener("click", lockIn);
$("#answer").addEventListener("keydown", (e) => { if (e.key === "Enter") lockIn(); });

function show(which) {
  ["boot", "join", "play", "pick", "wait"].forEach((id) => {
    $("#" + id).hidden = id !== which;
  });
}

function roomState(code) {
  return hostSeenAge(code).then((age) =>
    age === null ? "unknown" : age > HOST_GONE ? "over" : "live");
}

function dropDeadRoom(code, teamId) {
  localStorage.removeItem(STORE);
  $("#code").value = urlCode || "";
  db.ref("rooms/" + code + "/teams/" + teamId).remove().catch(() => {});
}

function loadSaved() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
  return raw && raw.code && raw.teamId ? raw : null;
}

function join() {
  const code = $("#code").value.trim().toUpperCase();
  const name = $("#team").value.trim();
  const members = $("#members").value.trim();
  if (!/^[A-Z]{4}$/.test(code)) { $("#joinErr").textContent = "Enter the 4-letter room code."; return; }
  if (!name) { $("#joinErr").textContent = "Enter a team name."; return; }

  $("#joinErr").textContent = "";
  $("#joinBtn").disabled = true;
  roomState(code)
    .then((state) => {
      if (state === "over") throw new Error("That game has ended. Ask for the new code.");
      const ref = db.ref("rooms/" + code + "/teams").push();
      // score is left off: database.rules.json requires only the four the buzzer required,
      // and a missing score reads as 0 everywhere, so joining stays one write.
      return ref.set({ name: name, members: members, answer: "", locked: false }).then(() => {
        localStorage.setItem(STORE, JSON.stringify({ code: code, teamId: ref.key }));
        attach(code, ref.key);
      });
    })
    .catch((err) => { $("#joinErr").textContent = err.message; })
    .finally(() => { $("#joinBtn").disabled = false; });
}

function attach(code, teamId) {
  myId = teamId;
  teamRef = db.ref("rooms/" + code + "/teams/" + teamId);
  gameRef = db.ref("rooms/" + code + "/game");

  teamRef.on("value", (snap) => {
    team = snap.val();
    if (!team) {                       // team gone (teacher ended the game)
      toJoinScreen();
      return;
    }
    $("#whoTeam").textContent = team.name;
    $("#whoCode").textContent = code;
    $("#pickWho").textContent = team.name;
    $("#waitWho").textContent = team.name;
    const s = money(team.score);
    $("#pickScore").textContent = s;
    $("#waitScore").textContent = s;
    setLocked(!!team.locked, team.answer || "");
    route();
  });

  gameRef.on("value", (snap) => { game = snap.val() || {}; route(); });
}

// Three things a student device can be doing, and the room decides which: answering an open
// clue, picking the next one, or waiting. No buttons for the student to get wrong.
function route() {
  if (!team) { show("join"); return; }
  if (game.clue) { show("play"); return; }
  if (game.turn === myId) { renderPick(); show("pick"); return; }
  const picker = game.turn ? "another team" : "the teacher";
  $("#waitMsg").textContent = game.turn
    ? "Waiting for " + picker + " to pick..."
    : "Waiting for the next clue...";
  show("wait");
}

// A list, not a replica of the board. The board is already on the screen at the front of the
// room, and a 6x5 grid on a phone is worse at the one job this has: tapping the right value.
function renderPick() {
  const grid = game.grid;
  const wrap = $("#pickList");
  wrap.textContent = "";
  if (!grid || !grid.cats) {
    wrap.textContent = "";
    $("#pickErr").textContent = "Waiting for the board...";
    return;
  }
  $("#pickErr").textContent = "";

  grid.cats.forEach((name, c) => {
    const row = document.createElement("div");
    row.className = "pickrow";

    const label = document.createElement("div");
    label.className = "pickcat";
    label.textContent = name;            // plain text by design: no maths in a category
    row.appendChild(label);

    const vals = document.createElement("div");
    vals.className = "pickvals";
    (grid.values[c] || []).forEach((value, r) => {
      const spent = !value || (game.used || {})[c + "-" + r];
      const b = document.createElement("button");
      b.className = "pickval" + (spent ? " spent" : "");
      b.textContent = value ? money(value) : "—";
      b.disabled = !!spent;
      if (!spent) b.addEventListener("click", () => sendPick(c, r));
      vals.appendChild(b);
    });
    row.appendChild(vals);
    wrap.appendChild(row);
  });
}

// Only a coordinate goes up. The control screen is the only thing that knows what the clue
// says, which is what keeps the answers off the network.
function sendPick(cat, row) {
  if (!gameRef) return;
  $("#pickErr").textContent = "";
  gameRef.child("pick").set({ team: myId, cat: cat, row: row })
    .catch((err) => { $("#pickErr").textContent = err.message; });
}

let leaveArmed = false;
let leaveTimer = null;
function armLeave() {
  if (!leaveArmed) {
    leaveArmed = true;
    $("#leaveIdle").hidden = true;
    $("#leaveArm").hidden = false;
    $("#leave").classList.add("arm");
    leaveTimer = setTimeout(disarmLeave, 4000);
    return;
  }
  clearTimeout(leaveTimer);
  disarmLeave();
  toJoinScreen();
}

function disarmLeave() {
  leaveArmed = false;
  $("#leaveIdle").hidden = false;
  $("#leaveArm").hidden = true;
  $("#leave").classList.remove("arm");
}

// Leaves the team in the database on purpose: the teacher keeps the row, the score and any
// locked answer, and can drop it with the x beside its row.
function toJoinScreen() {
  if (teamRef) { teamRef.off(); teamRef = null; }
  if (gameRef) { gameRef.off(); gameRef = null; }
  localStorage.removeItem(STORE);
  myId = null;
  team = null;
  game = {};
  wasLocked = false;
  $("#answer").disabled = false;
  $("#answer").value = "";
  $("#lock").disabled = false;
  $("#lock").textContent = "Lock Answer";
  $("#playErr").textContent = "";
  $("#code").value = "";
  show("join");
}

function setLocked(locked, answer) {
  const box = $("#answer");
  const btn = $("#lock");
  if (locked) {
    box.value = answer;
  } else if (wasLocked) {
    box.value = "";                    // only on release, so live typing is never wiped
    $("#playErr").textContent = "";
  }
  wasLocked = locked;
  box.disabled = locked;
  btn.disabled = locked;
  btn.textContent = locked ? "Locked in" : "Lock Answer";
}

function lockIn() {
  if (!teamRef) return;
  const answer = $("#answer").value.trim();
  if (!answer) return;                 // empty box does nothing
  beep();
  teamRef.update({ answer: answer, buzzedAt: SERVER_TIME, locked: true })
    .catch((err) => { $("#playErr").textContent = err.message; });
}
</script>
</body>
</html>
