<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clueboard</title>
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="katex/katex.min.css">
</head>
<body class="board">

<!-- Student-facing, on the projector. Nothing here is ever clicked: no cogs, no buttons, no
     settings. It reads the room and renders it. -->

<main id="stage">
  <section id="welcome">
    <div class="wtitle" id="wTitle" hidden></div>
    <p class="wlabel">Room code</p>
    <div class="wcode" id="wCode">----</div>
    <p class="wjoin">Join at <span id="wLink"></span></p>
    <p class="wteams" id="wTeams">Waiting for teams...</p>
  </section>

  <section id="boardState" hidden>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Nothing but the words. On the show a clue screen carries no value, no category and no
       room code - and a classroom that can read the category off the grid behind it does not
       need it twice. -->
  <section id="cluePanel" hidden aria-live="polite">
    <div class="cluebody">
      <div class="splash" id="ddSplash" hidden>
        <div class="splashtitle">DAILY DOUBLE</div>
        <div class="splashwho" id="ddWho"></div>
      </div>
      <div class="finalcat" id="finalCat" hidden></div>
      <div class="cluetext" id="clueText"></div>
      <img id="clueImage" alt="" hidden>
      <div class="clueanswer" id="clueAnswer" hidden></div>
      <div class="think" id="think" hidden>
        <div class="thinktrack"><div class="thinkfill" id="thinkFill"></div></div>
        <div class="thinknum" id="thinkNum"></div>
      </div>
    </div>
  </section>
  <!-- The category intro. One tile fills the screen with its neighbours' edges showing, and
       the strip slides across; the teacher's press is the only thing that moves it. -->
  <section id="introPanel" hidden>
    <div class="introstrip" id="introStrip"></div>
  </section>
</main>

<footer id="podiums"></footer>

<div class="cornercode" id="cornerCode"></div>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="katex/katex.min.js"></script>
<script src="firebase-config.js"></script>
<script src="demo.js"></script>
<script src="common.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const code = (new URL(location).searchParams.get("room") || "")
  .toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);

// Up here, not beside expandFrom, because the first snapshot can arrive while this script is
// still being evaluated - a board opened on a clue that is already up renders from inside the
// listener's own synchronous first callback, and a const declared further down is still in
// its dead zone when that happens.
//
// Low energy on purpose. Nothing here overshoots or snaps: one easing that leaves rest and
// returns to rest, and one duration for every move the room watches, so the board keeps a
// single tempo instead of five. The same number is --slow in board.css: change both.
const EASE = "cubic-bezier(.4, 0, .2, 1)";
const SLOW = 1500;
const EXPAND_MS = SLOW;
const SHRINK_MS = SLOW;
const REVEAL_MS = SLOW;
const COUNT_MS = SLOW;
// The clue text fades in over the back of the expand and lands exactly as the panel stops.
// It is not scaled with the panel, which would squash it on the way out of the cell.
// Matches .cluebody's transition in board.css.
const BODY_FADE = 900;
let shrinkTimer = null;  // non-null while a dismiss is on its way back to its cell

// The opening of a game: a bare board, then the values five at a time, then the categories
// one by one. Paced from the control screen except for the value sweep, which is one run of
// staggered transitions rather than a timer the teacher could get ahead of.
// Three movements, end to end, none overlapping: the board dissolves in bare over one beat,
// the values fill it, the title card rises over another. The sweep ticks five times to the
// beat and each value fades over a third of one, so the whole opening is counted in the same
// 1500ms as everything else rather than in numbers of its own.
const SWEEP_BATCH = 5;
const SWEEP_STEP = SLOW / 5;
const SWEEP_FADE = SLOW / 3;   // matches .cell span's transition in board.css
const INTRO_FADE = SLOW;
let introAt = null;      // the intro stop on screen, null when there is no intro
let introStripSig = "";
let introHide = null;
let welcomeWas = null;   // null until the first snapshot: see setWelcome
let welcomeHide = null;

let game = {};
let teams = [];
let cellEls = [];        // cellEls[cat][row], so a clue can expand out of its own cell
let shownKey = null;     // which cell the open clue came from, for the shrink back
let gridSig = "";        // rebuild the grid only when its shape actually changes
let introSig = "";       // which grid has already had its intro, so a resize does not replay it
let podiumSig = "";      // rebuild the podiums only when the teams change, never mid-tick
let podiumEls = {};      // teamId -> { box, score, extra }
let shownScores = {};    // what each podium currently reads, so a change can count up to it
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
let thinkEnds = 0;       // server ms when the think time is up, 0 when there is no timer
let thinkTotal = 1;      // what the bar is drawn against, taken when the timer first appears
let thinkRaf = null;

const joinHere = new URL("./", location.href).href
  .replace(/^https?:\/\//, "").replace(/\/$/, "");
$("#wLink").textContent = joinHere;
$("#wCode").textContent = code || "----";
$("#cornerCode").textContent = code ? code + "  ·  " + joinHere : "";

if (!code) {
  $("#wTeams").textContent = "Open this board from the control screen.";
} else {
  db.ref("rooms/" + code + "/game").on("value", (snap) => {
    game = snap.val() || {};
    render();
  });
  db.ref("rooms/" + code + "/teams").on("value", (snap) => {
    teams = [];
    snap.forEach((child) => {
      const t = child.val() || {};
      teams.push({
        id: child.key,
        name: t.name || "",
        answer: t.answer || "",
        score: Number(t.score) || 0,
        buzzedAt: t.buzzedAt || 0,
        wager: (t.wager === undefined || t.wager === null) ? null : Number(t.wager)
      });
    });
    render();
  });
}

function render() {
  const clue = game.clue || null;
  const played = game.used && Object.keys(game.used).length;

  // The welcome card holds until the first clue is picked, so it needs nothing from the
  // teacher to get out of the way. After that the code lives in the corner instead.
  const welcoming = !game.started && !played && !clue;
  setWelcome(welcoming);
  // The one place a game that skips the category intro still shows its own name.
  $("#wTitle").textContent = game.title || "";
  $("#wTitle").hidden = !game.title;
  // Off unless the teacher turns it on, and never over a clue. A class that has already
  // joined has no use for it, and a game screen is the clue and nothing else.
  $("#cornerCode").hidden = welcoming || !!clue || !game.showCode;
  $("#wTeams").textContent = teams.length
    ? teams.map((t) => t.name).join("  ·  ")
    : "Waiting for teams...";

  $("#boardState").hidden = welcoming;
  if (!welcoming) renderGrid();
  renderIntro();

  renderPodiums();
  renderClue(clue);
  renderThink();
}

// The welcome card leaves by fading out over the beat the board takes to dissolve in under
// it, rather than being cut away - it is the first move of the game and the room is watching
// it. welcomeWas starts null so a board opened mid-lesson hides the card outright instead of
// fading one that was never on screen.
function setWelcome(on) {
  const el = $("#welcome");
  if (on === welcomeWas) return;
  const first = welcomeWas === null;
  welcomeWas = on;
  clearTimeout(welcomeHide);
  if (on) {
    el.hidden = false;
    el.classList.remove("going");
  } else if (first) {
    el.hidden = true;
  } else {
    el.classList.add("going");
    welcomeHide = setTimeout(() => { el.hidden = true; }, SLOW);
  }
}

// Visual only. It tells the room how long is left and nothing else - no answer is locked when
// it runs out, because this game is marked by hand and a slow device is not a wrong answer.
function renderThink() {
  const clue = game.clue;
  const ends = Number(game.timerEnds) || 0;
  const live = !!(clue && clue.final && !game.wagering && ends);

  $("#think").hidden = !live;
  if (!live) {
    thinkEnds = 0;
    if (thinkRaf) { cancelAnimationFrame(thinkRaf); thinkRaf = null; }
    return;
  }

  // The full length is taken the first time a timer appears rather than published alongside
  // it: one field in the room instead of two, and a board opened mid-countdown still draws a
  // bar that drains to nothing at the right moment.
  if (ends !== thinkEnds) {
    thinkEnds = ends;
    thinkTotal = Math.max(1, ends - serverNow());
  }
  if (!thinkRaf) thinkRaf = requestAnimationFrame(tickThink);
}

function tickThink() {
  if (!thinkEnds) { thinkRaf = null; return; }
  const left = Math.max(0, thinkEnds - serverNow());
  $("#thinkFill").style.transform = "scaleX(" + (left / thinkTotal) + ")";
  $("#thinkNum").textContent = left ? String(Math.ceil(left / 1000)) : "Time";
  $("#think").classList.toggle("out", !left);
  thinkRaf = left ? requestAnimationFrame(tickThink) : null;
}

function renderGrid() {
  const grid = game.grid;
  if (!grid || !grid.cats) return;

  // Rebuilding on every snapshot would throw away the elements a running expand animation is
  // measured against, so only the shape rebuilds; spent cells are a class change.
  const sig = JSON.stringify([grid.cats, grid.values]);
  if (sig !== gridSig) {
    gridSig = sig;
    const wrap = $("#grid");
    // A resize rebuilds the same grid, and replaying the intro then would be a flourish in the
    // middle of a lesson. Only a grid we have not introduced before gets one.
    // The categories-drop-in intro belongs to a board that opens straight onto the grid. A
    // game opening with the category intro gets its own reveal, so this one sits out - but
    // the signature is still recorded, so it does not fire later when the intro ends.
    const fresh = sig !== introSig;
    if (fresh) introSig = sig;
    const intro = fresh && !Number.isInteger(game.intro);
    wrap.classList.toggle("intro", intro);
    wrap.textContent = "";
    cellEls = [];
    grid.cats.forEach((name, c) => {
      const head = document.createElement("div");
      head.className = "cat";
      head.style.gridColumn = c + 1;
      head.style.gridRow = 1;
      head.textContent = name;
      if (intro) head.style.animationDelay = (c * 115) + "ms";
      wrap.appendChild(head);
      cellEls[c] = [];
      (grid.values[c] || []).forEach((value, r) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.style.gridColumn = c + 1;
        cell.style.gridRow = r + 2;
        const v = document.createElement("span");
        v.textContent = value ? money(value) : "";
        cell.appendChild(v);
        // Column by column, starting once the last category has landed: a wipe across the
        // board rather than thirty cells arriving at once.
        if (intro) cell.style.animationDelay = (grid.cats.length * 115 + c * 72) + "ms";
        wrap.appendChild(cell);
        cellEls[c][r] = cell;
      });
    });
  }

  grid.cats.forEach((name, c) => {
    (grid.values[c] || []).forEach((value, r) => {
      const el = cellEls[c] && cellEls[c][r];
      if (!el) return;
      const spent = !value || (game.used || {})[(game.round || 1) + "-" + c + "-" + r];
      el.classList.toggle("spent", !!spent);
    });
  });

}

// Rebuilt only when the teams themselves change. Wiping the row on every snapshot would cut
// every counting score short, because a snapshot arrives the moment a score is written.
function renderPodiums() {
  const wrap = $("#podiums");
  const order = teams.slice().sort((a, b) => a.id.localeCompare(b.id));
  const clue = game.clue || null;
  const isFinal = !!(clue && clue.final);

  const sig = JSON.stringify(order.map((t) => [t.id, t.name]));
  if (sig !== podiumSig) {
    podiumSig = sig;
    wrap.textContent = "";
    podiumEls = {};
    order.forEach((t) => {
      const box = document.createElement("div");
      box.className = "podium";
      const name = document.createElement("div");
      name.className = "pname";
      name.textContent = t.name;
      const score = document.createElement("div");
      score.className = "pscore";
      const extra = document.createElement("div");
      extra.className = "pextra";
      box.append(name, score, extra);
      wrap.appendChild(box);
      podiumEls[t.id] = { box: box, score: score, extra: extra };
    });
    Object.keys(shownScores).forEach((id) => {
      if (!podiumEls[id]) delete shownScores[id];
    });
  }

  order.forEach((t) => {
    const els = podiumEls[t.id];
    if (!els) return;

    const open = isFinal ? !!(game.shown || {})[t.id] : !!game.reveal;

    // The lit podium means "this team answered". During Final that is a result, not a status:
    // it would show the room who left it blank before the reveal reached them.
    const lit = t.buzzedAt && (!isFinal || open);

    els.box.classList.toggle("picking", t.id === game.turn);
    els.box.classList.toggle("buzzed", !!lit);
    setScore(els, t.id, t.score);

    // Answers go up only once the teacher has revealed, so the board never spoils a question
    // for the teams still thinking. Final is revealed team by team instead, reading `shown`
    // and ignoring `reveal` - otherwise revealing the answer would put every response up at
    // once and throw away the one-at-a-time reveal.
    els.extra.textContent = "";
    if (isFinal && game.wagering && t.wager !== null) {
      els.extra.appendChild(podiumLine("pready", "Wager in"));   // who is ready, never how much
    }
    if (open && t.answer) {
      els.extra.appendChild(podiumLine("panswer", t.answer));    // student-typed: textContent
    } else if (open && isFinal) {
      // A Final reveal is one team, chosen by the teacher, so it has to show something even
      // when that team wrote nothing - otherwise tapping the answer on the dashboard looks
      // like a control that does not work. On an ordinary clue it stays silent: five podiums
      // saying "No answer" is noise, not a result.
      els.extra.appendChild(podiumLine("panswer blank", "No answer"));
    }
    if (isFinal && open && t.wager !== null) {
      els.extra.appendChild(podiumLine("pbet", "Wagered " + money(t.wager)));
    }
  });
  wrap.hidden = !order.length;
}

function podiumLine(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  return el;
}

// A score changing is the result of the clue, so it counts rather than jumps and the podium
// flashes which way it went. A team seen for the first time simply appears at its score -
// there is nothing to count from, and an intro should not look like six teams scoring at once.
function setScore(els, id, to) {
  const from = shownScores[id];
  shownScores[id] = to;
  els.score.classList.toggle("neg", to < 0);
  if (from === undefined || from === to || reduced.matches) {
    els.score.textContent = money(to);
    return;
  }

  els.box.classList.remove("up", "down");
  void els.box.offsetWidth;                  // so the flash restarts on a second change
  els.box.classList.add(to > from ? "up" : "down");

  const started = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - started) / COUNT_MS);
    const eased = 1 - Math.pow(1 - p, 3);
    els.score.textContent = money(Math.round(from + (to - from) * eased));
    if (p < 1) requestAnimationFrame(step);
  })(started);
}

function renderClue(clue) {
  const panel = $("#cluePanel");

  if (!clue) {
    // Dismissing writes two fields, so a second snapshot lands about a millisecond later and
    // re-enters this. Starting the shrink twice killed it outright: the second call's layout
    // read commits the end transform before the browser has begun a transition to it, so the
    // panel vanished where it stood. shownKey is cleared when the shrink lands, not here, for
    // the same reason - the second call needs a cell to aim at.
    if (!panel.hidden && !shrinkTimer) shrinkBack(panel);
    return;
  }

  const key = clue.final ? "final" : clue.cat + "-" + clue.row;
  const fresh = key !== shownKey;
  shownKey = key;

  // Three things this panel can be showing, and the room decides which: a Daily Double splash
  // or a Final category while wagers come in, then the clue itself.
  const wagering = !!game.wagering;
  const splash = !!(clue.dd && wagering);
  const catOnly = !!(clue.final && wagering);
  const hideClue = splash || catOnly;

  const splashEl = $("#ddSplash");
  splashEl.hidden = !splash;
  $("#ddWho").textContent = splash ? (clue.ownerName || "") : "";
  // Restarted by hand: the element is reused, and a CSS animation only runs again if it is
  // taken off and put back with a reflow in between.
  if (splash && fresh) {
    splashEl.classList.remove("punch");
    void splashEl.offsetWidth;
    splashEl.classList.add("punch");
  } else if (!splash) {
    splashEl.classList.remove("punch");
  }
  $("#finalCat").hidden = !catOnly;
  if (catOnly) $("#finalCat").textContent = clue.category || "";

  $("#clueText").hidden = hideClue;
  if (!hideClue) mathText($("#clueText"), clue.text);

  const img = $("#clueImage");
  if (clue.image && !hideClue) {
    // Images are public by design: a clue image goes on the projector, so it is not a secret
    // and has no reason to be local. The cell holds a filename or any URL.
    img.src = /^https?:/.test(clue.image) ? clue.image : "clues/images/" + clue.image;
    img.hidden = false;
  } else {
    img.hidden = true;
    img.removeAttribute("src");
  }

  const ansEl = $("#clueAnswer");
  const showing = !!(game.reveal && !hideClue && clue.answer);
  if (showing && ansEl.hidden) {
    openAnswer(ansEl, clue.answer);
  } else if (!showing) {
    ansEl.hidden = true;
    ansEl.textContent = "";
    ansEl.style.cssText = "";
    clearMovers();
  }

  if (fresh || panel.hidden) expandFrom(panel, clue.cat, clue.row);
}

// The answer arriving is the beat of the whole screen, so it is the one thing that moves
// slowly. The clue eases up out of the way while the answer and its rule fade in underneath,
// both over the same span, so they are fully there exactly as the clue comes to rest.
//
// A FLIP, like the expand: show the answer, measure what that did to everything above it, put
// it all back with a transform and let the transform run out. Transform and opacity only, so
// a laptop driving a projector keeps its frame rate even on an 86px clue.
function movers(ansEl) {
  return Array.prototype.slice.call($(".cluebody").children)
    .filter((el) => el !== ansEl && !el.hidden);
}

function clearMovers() {
  movers($("#clueAnswer")).forEach((el) => {
    el.style.transition = "";
    el.style.transform = "";
  });
}

function openAnswer(ansEl, text) {
  const moving = movers(ansEl);
  const before = moving.map((el) => el.getBoundingClientRect().top);

  mathText(ansEl, text);
  ansEl.style.transition = "none";
  ansEl.style.opacity = "0";
  ansEl.hidden = false;

  const shifts = moving.map((el, i) => before[i] - el.getBoundingClientRect().top);
  moving.forEach((el, i) => {
    el.style.transition = "none";
    el.style.transform = "translateY(" + shifts[i] + "px)";
  });
  void ansEl.offsetWidth;

  moving.forEach((el) => {
    el.style.transition = "transform " + REVEAL_MS + "ms " + EASE;
    el.style.transform = "translateY(0)";
  });
  // Linear against an eased move: the fade is steady the whole way and the clue is what
  // slows down, which is the half the eye follows.
  ansEl.style.transition = "opacity " + REVEAL_MS + "ms linear";
  ansEl.style.opacity = "1";
}

// Driven entirely by game/intro: the board decides when things move on screen, never when
// the game moves on. A stop index of 0 is a real position - the title card - so "no intro"
// is told apart from it by type rather than by truthiness.
function renderIntro() {
  const at = Number.isInteger(game.intro) ? game.intro : null;
  const panel = $("#introPanel");

  if (at === null) {
    if (introAt !== null) {                       // dissolve back to the populated board
      panel.classList.remove("up");
      // Cleared, or the fade out would first sit through the wait the sweep gave the fade in.
      panel.style.transitionDelay = "";
      clearTimeout(introHide);
      introHide = setTimeout(() => { panel.hidden = true; }, INTRO_FADE);
      $("#grid").classList.remove("nocats", "sweeping");
    }
    introAt = null;
    return;
  }

  if (introAt === null) sweepValues();            // the first snapshot of this intro
  introAt = at;

  buildStrip();
  $("#introStrip").style.setProperty("--i", String(at));
}

// "The prices randomly appear 5 at a time." One shuffle and one delay per cell, so the
// browser runs the whole sweep - no timer per batch to leave behind if the intro is cut
// short, and nothing to drift if the tab is throttled.
function sweepValues() {
  const grid = $("#grid");
  const spans = Array.prototype.slice.call(grid.querySelectorAll(".cell span"));
  grid.classList.add("nocats", "sweeping");
  $("#boardState").classList.remove("dissolve");
  void grid.offsetWidth;                          // the bare board, committed before it fills
  $("#boardState").classList.add("dissolve");

  for (let i = spans.length - 1; i > 0; i--) {    // Fisher-Yates, so no value lands in order
    const j = Math.floor(Math.random() * (i + 1));
    const t = spans[i]; spans[i] = spans[j]; spans[j] = t;
  }
  spans.forEach((span, i) => {
    // Held back a whole beat, so the values start filling the board exactly as the board
    // itself finishes dissolving in, rather than arriving through it.
    span.style.transitionDelay = (SLOW + Math.floor(i / SWEEP_BATCH) * SWEEP_STEP) + "ms";
  });
  grid.classList.remove("sweeping");

  // The title card starts rising the moment the last value has finished fading, with no
  // pause between. Held off in CSS rather than fired by a timer, so it is on the same clock
  // as the values themselves and cannot drift from them - a timer is read off the moment the
  // script ran, and a browser that is behind on frames commits the transitions later than
  // that. Reduced motion zeroes this delay with every other one, so it needs no case here.
  const batches = Math.ceil(spans.length / SWEEP_BATCH);
  raiseIntro(SLOW + (batches - 1) * SWEEP_STEP + SWEEP_FADE);
}

// Stop 0 is the game's title and the rest are the categories, all on one strip: the title
// pans in and out exactly as a category does, and the board needs no second panel for it.
function buildStrip() {
  const names = [game.title || ""].concat(((game.grid || {}).cats) || []);
  const sig = names.join("|");
  if (sig === introStripSig) return;
  introStripSig = sig;
  const strip = $("#introStrip");
  strip.textContent = "";
  names.forEach((name, i) => {
    const tile = document.createElement("div");
    tile.className = i ? "introtile" : "introtile gametitle";
    tile.textContent = name;                      // the teacher's own text, still not innerHTML
    strip.appendChild(tile);
  });
}

function raiseIntro(delay) {
  const panel = $("#introPanel");
  if (!panel.hidden) return;
  clearTimeout(introHide);
  panel.style.transitionDelay = (delay || 0) + "ms";
  panel.hidden = false;
  void panel.offsetWidth;
  panel.classList.add("up");
}

// The signature move: the cell grows to fill the screen. A FLIP off the cell's own rect, so
// it is one transform and nothing is measured twice. Transform only - no width or height - so
// it stays on the compositor and holds its frame rate on a school laptop driving a projector.
//
function expandFrom(panel, cat, row) {
  const cell = cellEls[cat] && cellEls[cat][row];
  // A clue picked while the last one is still shrinking: drop the pending hide, or it fires
  // mid-expand and blanks the new clue.
  clearTimeout(shrinkTimer);
  shrinkTimer = null;
  panel.hidden = false;
  panel.classList.remove("settled");

  if (!cell || !cell.getBoundingClientRect) { panel.classList.add("settled"); return; }
  const r = cell.getBoundingClientRect();
  // Measured against the panel's own containing block, not the viewport, because the panel
  // covers the stage rather than the whole page.
  const base = panel.parentElement.getBoundingClientRect();
  if (!r.width || !r.height || !base.width || !base.height) { panel.classList.add("settled"); return; }

  panel.style.transition = "none";
  panel.style.transformOrigin = "0 0";
  panel.style.transform = boxTransform(r, base);
  panel.style.opacity = "1";

  // Reads a layout property to force the start transform into the computed style. Without it
  // the browser coalesces both transforms into one recalc, never holds the cell-sized frame,
  // and the panel simply appears full screen - which is what it did. The same one-line trick
  // the Daily Double splash uses two functions up.
  void panel.offsetWidth;

  panel.style.transition = "transform " + EXPAND_MS + "ms " + EASE;
  panel.style.transform = "translate(0,0) scale(1,1)";
  // Timed so the text is fully there exactly as the panel stops, rather than popping in part
  // way and then being scaled the rest of the journey.
  // Nothing to wait for when the expand itself was taken away: without this the clue screen
  // would sit blank for the 600ms the fade was meant to start at.
  setTimeout(() => panel.classList.add("settled"),
             reduced.matches ? 0 : EXPAND_MS - BODY_FADE);
}

function boxTransform(r, base) {
  return "translate(" + (r.left - base.left) + "px," + (r.top - base.top) + "px)" +
    " scale(" + (r.width / base.width) + "," + (r.height / base.height) + ")";
}

function shrinkBack(panel) {
  const parts = (shownKey || "").split("-");
  const cell = cellEls[parts[0]] && cellEls[parts[0]][parts[1]];
  panel.classList.remove("settled");
  if (!cell) { panel.hidden = true; panel.style.transform = ""; shownKey = null; return; }

  const r = cell.getBoundingClientRect();
  const base = panel.parentElement.getBoundingClientRect();
  panel.style.transition = "transform " + SHRINK_MS + "ms " + EASE +
    ", opacity " + SHRINK_MS + "ms linear";
  // Committed before the transform moves. Changing the transition and the transform in one
  // style recalc started the opacity transition and silently dropped the transform one - the
  // panel faded where it stood instead of shrinking into its cell.
  void panel.offsetWidth;
  panel.style.transform = boxTransform(r, base);
  panel.style.opacity = "0";
  shrinkTimer = setTimeout(() => {
    panel.hidden = true;
    panel.style.transition = "none";
    panel.style.transform = "";
    panel.style.opacity = "1";
    shownKey = null;
    shrinkTimer = null;
  }, SHRINK_MS + 10);
}

// A projector's size does not change mid-lesson, but a window dragged onto one does, and the
// grid is the thing the expand is measured against. Debounced, because a drag fires this many
// times a second and each one rebuilds every cell.
let resizeTimer = null;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { gridSig = ""; render(); }, 150);
});
</script>
</body>
</html>
