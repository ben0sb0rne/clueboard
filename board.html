<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clueboard</title>
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="katex/katex.min.css">
</head>
<body class="board">

<!-- Student-facing, on the projector. Nothing here is ever clicked: no cogs, no buttons, no
     settings. It reads the room and renders it. -->

<main id="stage">
  <section id="welcome">
    <div class="wtitle" id="wTitle" hidden></div>
    <p class="wlabel">Room code</p>
    <div class="wcode" id="wCode">----</div>
    <p class="wjoin">Join at <span id="wLink"></span></p>
    <p class="wteams" id="wTeams">Waiting for teams...</p>
  </section>

  <section id="boardState" hidden>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Nothing but the words. On the show a clue screen carries no value, no category and no
       room code - and a classroom that can read the category off the grid behind it does not
       need it twice. -->
  <section id="cluePanel" hidden aria-live="polite">
    <div class="cluebody">
      <div class="splash" id="ddSplash" hidden>
        <div class="splashtitle">DAILY DOUBLE</div>
        <div class="splashwho" id="ddWho"></div>
      </div>
      <div class="finalcat" id="finalCat" hidden></div>
      <div class="cluetext" id="clueText"></div>
      <!-- The clue's picture or video, found in this device's own copy of the set. -->
      <div class="cluemedia" id="clueMedia" hidden></div>
      <div class="clueanswer" id="clueAnswer" hidden></div>
      <div class="think" id="think" hidden>
        <div class="thinktrack"><div class="thinkfill" id="thinkFill"></div></div>
        <div class="thinknum" id="thinkNum"></div>
      </div>
    </div>
  </section>
  <!-- The category intro. One tile fills the screen with its neighbours' edges showing, and
       the strip slides across; the teacher's press is the only thing that moves it. -->
  <section id="introPanel" hidden>
    <div class="introstrip" id="introStrip"></div>
  </section>

  <!-- How the game ends. Last place arrives at the bottom of the screen and each place
       above it a beat later, so the room finishes on the winner at the top. -->
  <section id="results" hidden>
    <h2 class="rtitle">Final scores</h2>
    <div class="resultlist" id="resultList"></div>
  </section>
</main>

<footer id="podiums"></footer>

<!-- One-screen mode, reached by "Run from the board" on the dashboard, which sends this tab
     here with host=1. It is for a teacher who cannot extend their display - an iPad mirrored
     to the TV is one screen, and so is a laptop with no second output - so the board and the
     controls have to be the same page. With two screens you leave this off and use the
     dashboard, which is what the second screen is for.
     This is the one screen the whole class is looking at, so the controls cannot simply sit
     on it. The bar comes up when the mouse moves and goes again a few seconds later, the way
     a video player's does: for all but a handful of seconds in a lesson there is nothing
     here to press. Dashboard is the way back, because renaming, members, removing a team and
     the settings all live over there.
     Clues are opened by clicking the cell and teams are marked on their own podium, which
     is the half of this that needs no chrome at all. -->
<div id="hostbar" hidden>
  <p class="hstate" id="hostState"></p>
  <p class="herr" id="hostErr"></p>
  <div class="hacts">
    <button id="hDash" class="quiet">Dashboard</button>
    <button id="hStart" class="quiet" hidden>Start game</button>
    <button id="hIntro" class="act" hidden>Start intro</button>
    <button id="hNext" class="act" hidden>Next</button>
    <button id="hShow" class="act" hidden>Show the clue</button>
    <button id="hTimer" class="quiet" hidden>Start the timer</button>
    <button id="hReveal" class="act" hidden>Reveal answer</button>
    <button id="hBack" class="quiet" hidden>Back to grid</button>
    <button id="hRound" class="quiet" hidden>Go to round 2</button>
    <button id="hFinal" class="quiet" hidden>Final clue</button>
    <button id="hEnd" class="quiet" hidden>End game</button>
  </div>
</div>

<div class="cornercode" id="cornerCode"></div>

<!-- Full screen on a press, never on its own: the window has to be dragged onto the
     projector's display first, and a browser only gives a page full screen for a press. -->
<button id="fullBtn" class="fullbtn" type="button" aria-label="Full screen" title="Full screen" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path class="enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
    <path class="leave" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
  </svg>
</button>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="katex/katex.min.js"></script>
<!-- Only board-only mode needs these, and only on the device that imported the set. They
     are two small files and loading them unconditionally beats a second code path. -->
<script src="clues.js"></script>
<script src="pictures.js"></script>
<script src="game.js"></script>
<!-- The room's colours. Two of them; palette.css works out the rest. -->
<script src="theme.js"></script>
<script src="firebase-config.js"></script>
<script src="demo.js"></script>
<script src="common.js"></script>
<script src="math.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const hostHere = new URL(location).searchParams.get("host") === "1";
const code = (new URL(location).searchParams.get("room") || "")
  .toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);

// Up here, not beside expandFrom, because the first snapshot can arrive while this script is
// still being evaluated - a board opened on a clue that is already up renders from inside the
// listener's own synchronous first callback, and a const declared further down is still in
// its dead zone when that happens.
//
// Low energy on purpose. Nothing here overshoots or snaps: one easing that leaves rest and
// returns to rest, and one duration for every move the room watches, so the board keeps a
// single tempo instead of five. The same number is --slow in palette.css: change both.
const EASE = "cubic-bezier(.4, 0, .2, 1)";
const SLOW = 1500;
const EXPAND_MS = SLOW;
const SHRINK_MS = SLOW;
const REVEAL_MS = SLOW;
const COUNT_MS = SLOW;
// The clue text fades in over the back of the expand and lands exactly as the panel stops.
// It is not scaled with the panel, which would squash it on the way out of the cell.
// Matches .cluebody's transition in board.css.
const BODY_FADE = 900;
let shrinkTimer = null;  // non-null while a dismiss is on its way back to its cell

// The opening of a game: a bare board, then the values five at a time, then the categories
// one by one. Paced from the control screen except for the value sweep, which is one run of
// staggered transitions rather than a timer the teacher could get ahead of.
// Three movements, end to end, none overlapping: the board dissolves in bare over one beat,
// the values fill it, the title card rises over another. The sweep ticks five times to the
// beat and each value fades over a third of one, so the whole opening is counted in the same
// 1500ms as everything else rather than in numbers of its own.
const SWEEP_BATCH = 5;
const SWEEP_STEP = SLOW / 5;
const SWEEP_FADE = SLOW / 3;   // matches .cell span's transition in board.css
const INTRO_FADE = SLOW;
let introAt = null;      // the intro stop on screen, null when there is no intro
let introStripSig = "";
let introHide = null;
let welcomeWas = null;   // null until the first snapshot: see setWelcome
let welcomeHide = null;

let game = {};
let teams = [];
let cellEls = [];        // cellEls[cat][row], so a clue can expand out of its own cell
let shownKey = null;     // which cell the open clue came from, for the shrink back
let mediaKey = "";       // the picture or video on screen, so a snapshot does not restart it
let gridSig = "";        // rebuild the grid only when its shape actually changes
let introSig = "";       // which grid has already had its intro, so a resize does not replay it
let podiumSig = "";      // rebuild the podiums only when the teams change, never mid-tick
let resultsSig = "";     // the scores the results screen is currently showing
let wagerFlash = {};     // teamId -> timer, while a wager is standing in for a score
let wagerFlashed = {};   // teamId -> true once that wager has had its beat
let podiumEls = {};      // teamId -> { box, score, extra }
let shownScores = {};    // what each podium currently reads, so a change can count up to it
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
let thinkEnds = 0;       // server ms when the think time is up, 0 when there is no timer
let thinkTotal = 1;      // what the bar is drawn against, taken when the timer first appears
let thinkRaf = null;

// Board-only mode. The clue set is read from this device's own storage - the same place the
// control screen keeps it - and never from the room, which is what keeps the answers off the
// network. A board opened anywhere else has no set, so it cannot host however the room is
// flagged: that is the gate, not a permission.
const SET_KEY = "clueboard-set";
let clueSet = null;
let moves = null;
let hosting = false;
let barTimer = null;
try {
  clueSet = readSet(localStorage.getItem(SET_KEY));
  if (!firstRound(clueSet)) clueSet = null;
} catch (e) { clueSet = null; }

const joinHere = new URL("./", location.href).href
  .replace(/^https?:\/\//, "").replace(/\/$/, "");
$("#wLink").textContent = joinHere;
$("#wCode").textContent = code || "----";
$("#cornerCode").textContent = code ? code + "  ·  " + joinHere : "";

if (!code) {
  $("#wTeams").textContent = "Open this board from the control screen.";
} else {
  db.ref("rooms/" + code + "/game").on("value", (snap) => {
    game = snap.val() || {};
    // Before render, so a board opening onto a themed room has never been the wrong colour.
    applyTheme(game.theme);
    render();
  });
  db.ref("rooms/" + code + "/teams").on("value", (snap) => {
    teams = [];
    snap.forEach((child) => {
      const t = child.val() || {};
      teams.push({
        id: child.key,
        name: t.name || "",
        members: t.members || "",
        answer: t.answer || "",
        score: Number(t.score) || 0,
        buzzedAt: t.buzzedAt || 0,
        wager: (t.wager === undefined || t.wager === null) ? null : Number(t.wager),
        // Shown nowhere. The board can start the game, and start() draws the first pick
        // from the teams that are in.
        ready: !!t.ready
      });
    });
    render();
  });
}

function render() {
  const clue = game.clue || null;
  const played = game.used && Object.keys(game.used).length;
  const over = !!game.over;

  // The welcome card holds until the first clue is picked, so it needs nothing from the
  // teacher to get out of the way. After that the code lives in the corner instead.
  const welcoming = !over && !game.started && !played && !clue;
  setWelcome(welcoming);
  // The one place a game that skips the category intro still shows its own name.
  $("#wTitle").textContent = game.title || "";
  $("#wTitle").hidden = !game.title;
  // Off unless the teacher turns it on, and never over a clue. A class that has already
  // joined has no use for it, and a game screen is the clue and nothing else.
  $("#cornerCode").hidden = welcoming || !!clue || !game.showCode || over;
  $("#wTeams").textContent = teams.length
    ? teams.map(teamLabel).join("  ·  ")
    : "Waiting for teams...";

  $("#boardState").hidden = welcoming;
  if (!welcoming) renderGrid();
  renderIntro();

  renderPodiums();
  renderClue(clue);
  renderThink();
  renderResults();
  // Last, because it reads what everything above has just settled.
  setHosting(hostHere && !!clueSet && !!code);
  renderHostBar();
}

/* ---------- board-only mode ---------- */

// The room carries the flag, not the URL, so the teacher can turn it on and off from the
// control screen mid-lesson and a board that is already open follows. A board with no clue
// set ignores it: it has no clue text to publish and no answers to reveal, so there is
// nothing for it to host with.
function setHosting(on) {
  if (on === hosting) return;
  hosting = on;
  document.body.classList.toggle("hosting", on);
  $("#hostbar").hidden = !on;
  if (on) {
    moves = hostMoves({
      db: db, code: code,
      game: () => game, teams: () => teams, clueSet: () => clueSet,
      fail: hostFail
    });
    // The control screen may have been closed and dragged away from, so this board says the
    // room still has a host. Two screens writing the same timestamp costs nothing.
    moves.startHeartbeat();
    wakeBar();
  } else if (moves) {
    moves.stopHeartbeat();
    moves = null;
  }
}

// An alert on a projector is a modal dialog in front of a class. It goes in the bar, and the
// bar stays up until the next thing happens.
function hostFail(msg) {
  $("#hostErr").textContent = msg;
  wakeBar(8000);
}

// Up on a mouse move, gone a few seconds later. CSS keeps it up while the pointer is on it,
// so it cannot vanish from under a click.
function wakeBar(ms) {
  if (!hosting) return;
  $("#hostbar").classList.add("up");
  clearTimeout(barTimer);
  barTimer = setTimeout(() => $("#hostbar").classList.remove("up"), ms || 3000);
}

// The browser's own full screen. The button wakes on the same moves as the bar, hosting or
// not, and goes again with it, so a still show carries no chrome. Hidden where a page cannot
// have full screen at all - an iPhone, for one.
const fullBtn = $("#fullBtn");
let fullTimer = null;
fullBtn.hidden = !document.fullscreenEnabled;
fullBtn.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
});
// Esc leaves without the button, so the icon follows the browser rather than the press.
document.addEventListener("fullscreenchange", () => {
  const on = !!document.fullscreenElement;
  fullBtn.classList.toggle("on", on);
  fullBtn.title = on ? "Leave full screen (Esc)" : "Full screen";
  fullBtn.setAttribute("aria-label", on ? "Leave full screen" : "Full screen");
});
function wakeFull() {
  fullBtn.classList.add("up");
  clearTimeout(fullTimer);
  fullTimer = setTimeout(() => fullBtn.classList.remove("up"), 3000);
}

function renderHostBar() {
  if (!hosting) return;
  const clue = game.clue || null;
  const intro = Number.isInteger(game.intro) ? game.intro : null;
  const over = !!game.over;
  const pre = !game.started && !clue && !over;
  const introing = intro !== null && !clue && !over;
  const wagering = !!(clue && game.wagering);
  const onGrid = !clue && !pre && !introing && !over;
  // Forward only: the dashboard has the way back, and this bar is on the projector.
  const next = nextRound(clueSet, Number(game.round) || 1);

  const show = (sel, on) => { $(sel).hidden = !on; };
  show("#hStart", pre);
  show("#hIntro", pre);
  show("#hNext", introing);
  show("#hShow", wagering);
  // Each of these goes the moment it has nothing left to do. On a projected board a button
  // that cannot be pressed is not a hint, it is a thing the class is looking at: the timer
  // has no question left to time once the answer is up, and after a final there is no board
  // to go back to.
  show("#hTimer", !!clue && !!clue.final && !wagering && !game.reveal);
  show("#hReveal", !!clue && !wagering && !game.reveal);
  show("#hBack", !!clue && !(clue.final && game.reveal));
  // Where the game can go next only belongs on screen when it is not in the middle of
  // something. Ending it is also offered straight after a final clue, which is what follows
  // one - there is no board to go back to.
  show("#hRound", onGrid && !!next);
  show("#hFinal", onGrid && !!finalClue(clueSet));
  show("#hEnd", onGrid || (!!clue && !!clue.final && !!game.reveal));

  if (next) $("#hRound").textContent = "Go to " + clueSet.rounds[next - 1].name;
  if (clue) {
    // Reveal first, then mark. There is nowhere private on a projected board, so the answer
    // going up is what the host marks against - the opposite way round from the dashboard,
    // where it sits on a second display only they can see.
    setGold($("#hReveal"), !wagering);
    setGold($("#hBack"), !!game.reveal && !clue.final);
    setGold($("#hEnd"), !!clue.final && !!game.reveal);
    $("#hTimer").textContent = game.timerEnds && game.timerEnds > serverNow()
      ? "Restart the timer" : "Start the timer";
  }
  $("#hostState").textContent = hostState(clue, intro, over);
}

function setGold(btn, primary) {
  btn.classList.toggle("act", primary);
  btn.classList.toggle("quiet", !primary);
}

// Short, because it is on the projector: where the game is and nothing else.
function hostState(clue, intro, over) {
  if (over) return "Game over";
  if (clue) {
    const where = clue.final ? "Final clue" : (clue.category || "") + " \u00b7 " + money(clue.value);
    return game.wagering ? where + " \u00b7 wagers" : where;
  }
  if (intro !== null) return "Intro";
  if (!game.started) return game.title || "Ready";
  const R = clueSet.rounds[(Number(game.round) || 1) - 1];
  return R ? R.name : "Round " + (Number(game.round) || 1);
}

$("#hDash").addEventListener("click", () => {
  location.href = "control.html?room=" + code + (window.DEMO ? "&demo=1" : "");
});
$("#hStart").addEventListener("click", () => moves.start(null));
$("#hIntro").addEventListener("click", () => moves.start(0));
$("#hNext").addEventListener("click", () => moves.nextIntro());
$("#hShow").addEventListener("click", () => moves.showClue());
$("#hTimer").addEventListener("click", () => moves.startTimer());
$("#hReveal").addEventListener("click", () => moves.reveal());
$("#hBack").addEventListener("click", () => moves.dismiss());
$("#hRound").addEventListener("click",
  () => moves.setRound(nextRound(clueSet, Number(game.round) || 1)));
$("#hFinal").addEventListener("click", () => moves.startFinal());
// Two presses, as on the control screen: it stops the lesson.
let endArmed = null;
$("#hEnd").addEventListener("click", () => {
  if (!endArmed) {
    endArmed = setTimeout(() => { endArmed = null; $("#hEnd").textContent = "End game"; },
                          4000);
    $("#hEnd").textContent = "Confirm";
    return;
  }
  clearTimeout(endArmed);
  endArmed = null;
  $("#hEnd").textContent = "End game";
  moves.end();
});
addEventListener("pointermove", () => { wakeBar(); wakeFull(); });
addEventListener("pointerdown", () => { $("#hostErr").textContent = ""; wakeBar(); wakeFull(); });
addEventListener("keydown", () => { wakeBar(); wakeFull(); });

// The scores, once the teacher has ended the game. Rebuilt only when a score actually
// changes, so a correction after the whistle replays the reveal and a stray snapshot does
// not. Last place is built first and the list is laid out in reverse, which is what puts it
// at the bottom of the screen with the winner at the top.
function renderResults() {
  const panel = $("#results");
  if (!game.over) {
    if (resultsSig) { resultsSig = ""; panel.hidden = true; panel.classList.remove("up"); }
    return;
  }

  const order = teams.slice().sort((a, b) => a.score - b.score || a.id.localeCompare(b.id));
  const sig = JSON.stringify(order.map((t) => [t.id, t.name, t.members, t.score]));
  if (sig === resultsSig) return;
  resultsSig = sig;

  const place = placeOf(order);
  const wrap = $("#resultList");
  wrap.textContent = "";
  // Rows divide the list evenly, so two teams get half a projector each. The type has to grow
  // with them or a huge card holds small writing. Six is the size the clamps above were drawn
  // for, and the cap stops a two-team finish becoming a billboard.
  wrap.style.setProperty("--rscale", Math.min(2.4, Math.max(1, 6 / order.length)).toFixed(2));
  order.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "result" + (place[t.id] === 1 ? " first" : "");
    // One beat per place, counting up the screen. Held in CSS rather than fired by a timer,
    // so reduced motion takes it out along with everything else on this board.
    row.style.transitionDelay = (i * (SLOW / 2)) + "ms";
    row.append(
      resultCell("rplace", String(place[t.id])),
      resultWho(t),
      resultCell("rscore" + (t.score < 0 ? " neg" : ""), money(t.score))
    );
    wrap.appendChild(row);
  });

  panel.classList.remove("up");
  panel.hidden = false;
  void panel.offsetWidth;                      // so the stagger starts from the hidden state
  panel.classList.add("up");
}

// Equal scores share a place and the next one down skips it - 1, 2, 2, 4 - which is how
// anyone reading a scoreboard expects it to go.
function placeOf(order) {
  const desc = order.slice().sort((a, b) => b.score - a.score);
  const place = {};
  desc.forEach((t, i) => {
    place[t.id] = i && desc[i - 1].score === t.score ? place[desc[i - 1].id] : i + 1;
  });
  return place;
}

function resultCell(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  return el;
}

function resultWho(t) {
  const who = document.createElement("div");
  who.className = "rwho";
  who.appendChild(resultCell("rname", t.name));
  // Who was in the team, which is the half of this a class actually reads out loud.
  if (t.members) who.appendChild(resultCell("rmembers", t.members));  // student-typed text
  return who;
}

// The welcome card leaves by fading out over the beat the board takes to dissolve in under
// it, rather than being cut away - it is the first move of the game and the room is watching
// it. welcomeWas starts null so a board opened mid-lesson hides the card outright instead of
// fading one that was never on screen.
function setWelcome(on) {
  const el = $("#welcome");
  if (on === welcomeWas) return;
  const first = welcomeWas === null;
  welcomeWas = on;
  clearTimeout(welcomeHide);
  if (on) {
    el.hidden = false;
    el.classList.remove("going");
  } else if (first) {
    el.hidden = true;
  } else {
    el.classList.add("going");
    welcomeHide = setTimeout(() => { el.hidden = true; }, SLOW);
  }
}

// Visual only. It tells the room how long is left and nothing else - no answer is locked when
// it runs out, because this game is marked by hand and a slow device is not a wrong answer.
function renderThink() {
  const clue = game.clue;
  const ends = Number(game.timerEnds) || 0;
  const live = !!(clue && clue.final && !game.wagering && ends);

  $("#think").hidden = !live;
  if (!live) {
    thinkEnds = 0;
    if (thinkRaf) { cancelAnimationFrame(thinkRaf); thinkRaf = null; }
    return;
  }

  // The full length is taken the first time a timer appears rather than published alongside
  // it: one field in the room instead of two, and a board opened mid-countdown still draws a
  // bar that drains to nothing at the right moment.
  if (ends !== thinkEnds) {
    thinkEnds = ends;
    thinkTotal = Math.max(1, ends - serverNow());
  }
  if (!thinkRaf) thinkRaf = requestAnimationFrame(tickThink);
}

function tickThink() {
  if (!thinkEnds) { thinkRaf = null; return; }
  const left = Math.max(0, thinkEnds - serverNow());
  $("#thinkFill").style.transform = "scaleX(" + (left / thinkTotal) + ")";
  $("#thinkNum").textContent = left ? String(Math.ceil(left / 1000)) : "Time";
  $("#think").classList.toggle("out", !left);
  thinkRaf = left ? requestAnimationFrame(tickThink) : null;
}

function renderGrid() {
  const grid = game.grid;
  if (!grid || !grid.cats) return;

  // Rebuilding on every snapshot would throw away the elements a running expand animation is
  // measured against, so only the shape rebuilds; spent cells are a class change.
  const sig = JSON.stringify([grid.cats, grid.values]);
  if (sig !== gridSig) {
    gridSig = sig;
    const wrap = $("#grid");
    // The round's own size, up to six by five; board.css lays it out from these two.
    wrap.style.setProperty("--cols", grid.cats.length);
    wrap.style.setProperty("--rows", (grid.values[0] || []).length);
    // A resize rebuilds the same grid, and replaying the intro then would be a flourish in the
    // middle of a lesson. Only a grid we have not introduced before gets one.
    // The categories-drop-in intro belongs to a board that opens straight onto the grid. A
    // game opening with the category intro gets its own reveal, so this one sits out - but
    // the signature is still recorded, so it does not fire later when the intro ends.
    const fresh = sig !== introSig;
    if (fresh) introSig = sig;
    const intro = fresh && !Number.isInteger(game.intro);
    wrap.classList.toggle("intro", intro);
    wrap.textContent = "";
    cellEls = [];
    grid.cats.forEach((name, c) => {
      const head = document.createElement("div");
      head.className = "cat";
      head.style.gridColumn = c + 1;
      head.style.gridRow = 1;
      head.textContent = name;
      if (intro) head.style.animationDelay = (c * 115) + "ms";
      wrap.appendChild(head);
      cellEls[c] = [];
      (grid.values[c] || []).forEach((value, r) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.style.gridColumn = c + 1;
        cell.style.gridRow = r + 2;
        const v = document.createElement("span");
        v.textContent = value ? money(value) : "";
        cell.appendChild(v);
        // Column by column, starting once the last category has landed: a wipe across the
        // board rather than thirty cells arriving at once.
        if (intro) cell.style.animationDelay = (grid.cats.length * 115 + c * 72) + "ms";
        // Board-only mode: the cell itself is how a clue is opened, which is the half of
        // running a game from the projector that needs no controls at all. It does nothing
        // on a board that is not hosting, and the cursor says so.
        cell.addEventListener("click", () => { if (hosting && moves) moves.select(c, r); });
        wrap.appendChild(cell);
        cellEls[c][r] = cell;
      });
    });
  }

  grid.cats.forEach((name, c) => {
    (grid.values[c] || []).forEach((value, r) => {
      const el = cellEls[c] && cellEls[c][r];
      if (!el) return;
      const spent = !value || (game.used || {})[(game.round || 1) + "-" + c + "-" + r];
      el.classList.toggle("spent", !!spent);
    });
  });

}

// Rebuilt only when the teams themselves change. Wiping the row on every snapshot would cut
// every counting score short, because a snapshot arrives the moment a score is written.
function renderPodiums() {
  const wrap = $("#podiums");
  const order = teams.slice().sort((a, b) => a.id.localeCompare(b.id));
  const clue = game.clue || null;
  const isFinal = !!(clue && clue.final);

  const sig = JSON.stringify(order.map((t) => [t.id, t.name]));
  if (sig !== podiumSig) {
    podiumSig = sig;
    wrap.textContent = "";
    podiumEls = {};
    order.forEach((t) => {
      const box = document.createElement("div");
      box.className = "podium";
      const name = document.createElement("div");
      name.className = "pname";
      name.textContent = t.name;
      const score = document.createElement("div");
      score.className = "pscore";
      const extra = document.createElement("div");
      extra.className = "pextra";
      // Board-only mode's other half. Built always and hidden by CSS until the board is
      // hosting, so a podium is never rebuilt mid-game just to grow a pair of buttons - the
      // rebuild is what would cut a counting score short.
      const mark = document.createElement("div");
      mark.className = "pmark";
      const id = t.id;
      [["+", 1], ["\u2212", -1]].forEach(([label, sign]) => {
        const b = document.createElement("button");
        b.className = sign > 0 ? "pplus" : "pminus";
        b.textContent = label;
        // The team is looked up at the moment of the press, never closed over: these buttons
        // outlive several scores and a stale one would award against the wrong total.
        b.addEventListener("click", () => {
          const live = teams.filter((x) => x.id === id)[0];
          if (moves && live) moves.score(live, sign);
        });
        mark.appendChild(b);
      });
      box.append(name, score, extra, mark);
      wrap.appendChild(box);
      podiumEls[t.id] = { box: box, score: score, extra: extra, mark: mark };
    });
    Object.keys(shownScores).forEach((id) => {
      if (!podiumEls[id]) delete shownScores[id];
    });
  }

  order.forEach((t) => {
    const els = podiumEls[t.id];
    if (!els) return;

    const open = isFinal ? !!(game.shown || {})[t.id] : !!game.reveal;

    // The lit podium means "this team answered". During Final that is a result, not a status:
    // it would show the room who left it blank before the reveal reached them.
    const lit = t.buzzedAt && (!isFinal || open);

    els.box.classList.toggle("picking", t.id === game.turn);
    els.box.classList.toggle("buzzed", !!lit);

    // A team that could not answer this clue must not be scorable on it: awarding $0 looks
    // harmless but still moves the next pick, so a stray press would hand it over.
    const scorable = hosting && !!clue && !game.wagering &&
      (!clue.dd || clue.owner === t.id);
    Array.prototype.forEach.call(els.mark.children, (b) => { b.disabled = !scorable; });

    // The wager takes the score's place for a beat as that team is revealed, at the score's
    // own size. It used to be a 10px line under the podium, which from the back of a room is
    // not there at all - and the number is the whole point of a final clue.
    const bet = isFinal && open && t.wager !== null;
    if (bet && !wagerFlashed[t.id]) {
      wagerFlashed[t.id] = true;
      flashWager(els, t.id, t.wager);
    }
    if (!wagerFlash[t.id]) setScore(els, t.id, t.score);

    // Answers go up only once the teacher has revealed, so the board never spoils a question
    // for the teams still thinking. Final is revealed team by team instead, reading `shown`
    // and ignoring `reveal` - otherwise revealing the answer would put every response up at
    // once and throw away the one-at-a-time reveal.
    els.extra.textContent = "";
    if (isFinal && game.wagering && t.wager !== null) {
      els.extra.appendChild(podiumLine("pready", "Wager in"));   // who is ready, never how much
    }
    if (open && t.answer) {
      els.extra.appendChild(podiumLine("panswer", t.answer));    // student-typed: textContent
    } else if (open && isFinal) {
      // A Final reveal is one team, chosen by the teacher, so it has to show something even
      // when that team wrote nothing - otherwise tapping the answer on the dashboard looks
      // like a control that does not work. On an ordinary clue it stays silent: five podiums
      // saying "No answer" is noise, not a result.
      els.extra.appendChild(podiumLine("panswer blank", "No answer"));
    }
  });
  // Nothing to replay once the final clue is behind us, so a reopened board does not flash
  // six wagers at a room that has already seen them.
  if (!isFinal) { clearFlashes(); }
  // Who is in and who is still thinking - but only once somebody actually is in. With no
  // clue open there is nothing to ring in to, and a teacher running the board on their own
  // with the class shouting out has no buzzes at all: either way this would dim every podium
  // for the whole game and call it a signal. Final is left out on purpose too - nobody is
  // lit there until the teacher reveals them, so dimming would give away who answered.
  const anyIn = order.some((t) => t.buzzedAt);
  wrap.classList.toggle("live", !!clue && !isFinal && !game.wagering && anyIn);
  wrap.hidden = !order.length || !!game.over;    // the results screen is the podiums now
}

// The wager, where the score was, for a beat and a half. When it is up the podium goes back
// through renderPodiums rather than putting a remembered number back, so a score the teacher
// awarded while it was showing is already the one that counts up.
function flashWager(els, id, wager) {
  clearTimeout(wagerFlash[id]);
  els.score.classList.add("wagered");
  els.score.textContent = money(wager);
  wagerFlash[id] = setTimeout(() => {
    wagerFlash[id] = null;
    els.score.classList.remove("wagered");
    renderPodiums();
  }, Math.round(SLOW * 1.5));
}

function clearFlashes() {
  Object.keys(wagerFlash).forEach((id) => clearTimeout(wagerFlash[id]));
  wagerFlash = {};
  wagerFlashed = {};
}

function podiumLine(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  return el;
}

// A score changing is the result of the clue, so it counts rather than jumps and the podium
// flashes which way it went. A team seen for the first time simply appears at its score -
// there is nothing to count from, and an intro should not look like six teams scoring at once.
function setScore(els, id, to) {
  const from = shownScores[id];
  shownScores[id] = to;
  els.score.classList.toggle("neg", to < 0);
  if (from === undefined || from === to || reduced.matches) {
    els.score.textContent = money(to);
    return;
  }

  els.box.classList.remove("up", "down");
  void els.box.offsetWidth;                  // so the flash restarts on a second change
  els.box.classList.add(to > from ? "up" : "down");

  const started = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - started) / COUNT_MS);
    const eased = 1 - Math.pow(1 - p, 3);
    els.score.textContent = money(Math.round(from + (to - from) * eased));
    if (p < 1) requestAnimationFrame(step);
  })(started);
}

function renderClue(clue) {
  const panel = $("#cluePanel");

  if (!clue) {
    showMedia(null);   // a video stops the moment its clue is put away
    // Dismissing writes two fields, so a second snapshot lands about a millisecond later and
    // re-enters this. Starting the shrink twice killed it outright: the second call's layout
    // read commits the end transform before the browser has begun a transition to it, so the
    // panel vanished where it stood. shownKey is cleared when the shrink lands, not here, for
    // the same reason - the second call needs a cell to aim at.
    if (!panel.hidden && !shrinkTimer) shrinkBack(panel);
    return;
  }

  const key = clue.final ? "final" : clue.cat + "-" + clue.row;
  // A clue reopened while it is still shrinking back is as new as one that never left: it
  // has the same key, and without this the shrink's timer would hide it a moment later.
  const fresh = key !== shownKey || !!shrinkTimer;
  shownKey = key;

  // Three things this panel can be showing, and the room decides which: a Daily Double splash
  // or a Final category while wagers come in, then the clue itself.
  const wagering = !!game.wagering;
  const splash = !!(clue.dd && wagering);
  const catOnly = !!(clue.final && wagering);
  const hideClue = splash || catOnly;

  const splashEl = $("#ddSplash");
  splashEl.hidden = !splash;
  $("#ddWho").textContent = splash ? (clue.ownerName || "") : "";
  // Restarted by hand: the element is reused, and a CSS animation only runs again if it is
  // taken off and put back with a reflow in between.
  if (splash && fresh) {
    splashEl.classList.remove("punch");
    void splashEl.offsetWidth;
    splashEl.classList.add("punch");
  } else if (!splash) {
    splashEl.classList.remove("punch");
  }
  $("#finalCat").hidden = !catOnly;
  if (catOnly) $("#finalCat").textContent = clue.category || "";

  $("#clueText").hidden = hideClue;
  if (!hideClue) mathText($("#clueText"), clue.text);

  showMedia(hideClue ? null : localMedia(clue));

  const ansEl = $("#clueAnswer");
  const showing = !!(game.reveal && !hideClue && clue.answer);
  if (showing && ansEl.hidden) {
    openAnswer(ansEl, clue.answer);
  } else if (!showing) {
    ansEl.hidden = true;
    ansEl.textContent = "";
    ansEl.style.cssText = "";
    clearMovers();
  }

  if (fresh || panel.hidden) expandFrom(panel, clue.cat, clue.row);
}

// The clue's picture or video comes from this device's own copy of the set and nowhere else:
// the room never carries one, so nothing about it reaches a student's phone. A board on a
// device that has not opened the game shows the words alone - which is why, with a phone as
// the control screen, the laptop on the projector opens the file too. The clue text has to
// match as well, so a board holding some other set shows nothing rather than the wrong picture.
function localMedia(clue) {
  if (!clueSet) return null;
  const R = clueSet.rounds[(Number(game.round) || 1) - 1];
  const s = clue.final ? clueSet.final : R && R.cells[clue.cat] && R.cells[clue.cat][clue.row];
  return s && s.media && s.clue === clue.text ? s.media : null;
}

// Rebuilt only when the media itself changes (mediaKey, up top). This runs on every snapshot,
// and a video put back up on each one would start again every time a team buzzed.
function showMedia(m) {
  const key = m ? JSON.stringify(m) : "";
  if (key === mediaKey) return;
  mediaKey = key;
  const box = $("#clueMedia");
  box.textContent = "";
  box.hidden = !m;
  if (!m) return;
  if (m.kind === "picture") {
    const img = document.createElement("img");
    img.alt = "";
    img.addEventListener("error", () => { box.hidden = true; });
    box.appendChild(img);
    if (!m.id) { img.src = m.url; return; }
    loadPictures([m.id]).then(() => {
      if (mediaKey !== key) return;
      if (pictureURLs[m.id]) img.src = pictureURLs[m.id];
      else box.hidden = true;   // not on this device
    });
    return;
  }
  // The teacher presses play on it, here: a clue is read out first, and a video that started
  // on its own would already be running.
  const embed = embedURL(m);
  const el = document.createElement(embed ? "iframe" : "video");
  if (embed) {
    el.src = embed;
    el.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    el.allowFullscreen = true;
    el.referrerPolicy = "strict-origin-when-cross-origin";
    el.title = (m.host || "") + " video";
  } else {
    el.src = m.url;
    el.controls = true;
    el.playsInline = true;
  }
  box.appendChild(el);
}

// The answer arriving is the beat of the whole screen, so it is the one thing that moves
// slowly. The clue eases up out of the way while the answer and its rule fade in underneath,
// both over the same span, so they are fully there exactly as the clue comes to rest.
//
// A FLIP, like the expand: show the answer, measure what that did to everything above it, put
// it all back with a transform and let the transform run out. Transform and opacity only, so
// a laptop driving a projector keeps its frame rate even on an 86px clue.
function movers(ansEl) {
  return Array.prototype.slice.call($(".cluebody").children)
    .filter((el) => el !== ansEl && !el.hidden);
}

function clearMovers() {
  movers($("#clueAnswer")).forEach((el) => {
    el.style.transition = "";
    el.style.transform = "";
  });
}

function openAnswer(ansEl, text) {
  const moving = movers(ansEl);
  const before = moving.map((el) => el.getBoundingClientRect().top);
  // Revealed during the expand, everything is measured inside a panel that is still scaled
  // down, but the transform below is in the panel's own pixels, so each move is divided by
  // the panel's scale - read the way boxTransform sets it. 1 while hidden, measuring nothing.
  const panel = $("#cluePanel");
  const scale = panel.getBoundingClientRect().height /
    panel.parentElement.getBoundingClientRect().height || 1;

  mathText(ansEl, text);
  ansEl.style.transition = "none";
  ansEl.style.opacity = "0";
  ansEl.hidden = false;

  const shifts = moving.map((el, i) => (before[i] - el.getBoundingClientRect().top) / scale);
  moving.forEach((el, i) => {
    el.style.transition = "none";
    el.style.transform = "translateY(" + shifts[i] + "px)";
  });
  void ansEl.offsetWidth;

  moving.forEach((el) => {
    el.style.transition = "transform " + REVEAL_MS + "ms " + EASE;
    el.style.transform = "translateY(0)";
  });
  // Linear against an eased move: the fade is steady the whole way and the clue is what
  // slows down, which is the half the eye follows.
  ansEl.style.transition = "opacity " + REVEAL_MS + "ms linear";
  ansEl.style.opacity = "1";
}

// Driven entirely by game/intro: the board decides when things move on screen, never when
// the game moves on. A stop index of 0 is a real position - the title card - so "no intro"
// is told apart from it by type rather than by truthiness.
function renderIntro() {
  const at = Number.isInteger(game.intro) ? game.intro : null;
  const panel = $("#introPanel");

  if (at === null) {
    if (introAt !== null) {                       // dissolve back to the populated board
      panel.classList.remove("up");
      // Cleared, or the fade out would first sit through the wait the sweep gave the fade in.
      panel.style.transitionDelay = "";
      clearTimeout(introHide);
      introHide = setTimeout(() => { panel.hidden = true; }, INTRO_FADE);
      $("#grid").classList.remove("nocats", "sweeping");
    }
    introAt = null;
    return;
  }

  if (introAt === null) sweepValues();            // the first snapshot of this intro
  introAt = at;

  buildStrip();
  $("#introStrip").style.setProperty("--i", String(at));
}

// "The prices randomly appear 5 at a time." One shuffle and one delay per cell, so the
// browser runs the whole sweep - no timer per batch to leave behind if the intro is cut
// short, and nothing to drift if the tab is throttled.
function sweepValues() {
  const grid = $("#grid");
  const spans = Array.prototype.slice.call(grid.querySelectorAll(".cell span"));
  grid.classList.add("nocats", "sweeping");
  $("#boardState").classList.remove("dissolve");
  void grid.offsetWidth;                          // the bare board, committed before it fills
  $("#boardState").classList.add("dissolve");

  for (let i = spans.length - 1; i > 0; i--) {    // Fisher-Yates, so no value lands in order
    const j = Math.floor(Math.random() * (i + 1));
    const t = spans[i]; spans[i] = spans[j]; spans[j] = t;
  }
  spans.forEach((span, i) => {
    // Held back a whole beat, so the values start filling the board exactly as the board
    // itself finishes dissolving in, rather than arriving through it.
    span.style.transitionDelay = (SLOW + Math.floor(i / SWEEP_BATCH) * SWEEP_STEP) + "ms";
  });
  grid.classList.remove("sweeping");

  // The title card starts rising the moment the last value has finished fading, with no
  // pause between. Held off in CSS rather than fired by a timer, so it is on the same clock
  // as the values themselves and cannot drift from them - a timer is read off the moment the
  // script ran, and a browser that is behind on frames commits the transitions later than
  // that. Reduced motion zeroes this delay with every other one, so it needs no case here.
  const batches = Math.ceil(spans.length / SWEEP_BATCH);
  raiseIntro(SLOW + (batches - 1) * SWEEP_STEP + SWEEP_FADE);
}

// Stop 0 is the game's title and the rest are the categories, all on one strip: the title
// pans in and out exactly as a category does, and the board needs no second panel for it.
function buildStrip() {
  const names = [game.title || ""].concat(((game.grid || {}).cats) || []);
  const sig = names.join("|");
  if (sig === introStripSig) return;
  introStripSig = sig;
  const strip = $("#introStrip");
  strip.textContent = "";
  names.forEach((name, i) => {
    const tile = document.createElement("div");
    tile.className = i ? "introtile" : "introtile gametitle";
    tile.textContent = name;                      // the teacher's own text, still not innerHTML
    strip.appendChild(tile);
  });
}

function raiseIntro(delay) {
  const panel = $("#introPanel");
  if (!panel.hidden) return;
  clearTimeout(introHide);
  panel.style.transitionDelay = (delay || 0) + "ms";
  panel.hidden = false;
  void panel.offsetWidth;
  panel.classList.add("up");
}

// The signature move: the cell grows to fill the screen. A FLIP off the cell's own rect, so
// it is one transform and nothing is measured twice. Transform only - no width or height - so
// it stays on the compositor and holds its frame rate on a school laptop driving a projector.
//
function expandFrom(panel, cat, row) {
  const cell = cellEls[cat] && cellEls[cat][row];
  // A clue picked while the last one is still shrinking: drop the pending hide, or it fires
  // mid-expand and blanks the new clue. Drop the shrink's own transform and fade with it, on
  // every way out of here: the final has no cell to grow from, and it opened on a panel still
  // faded out in the last clue's cell.
  clearTimeout(shrinkTimer);
  shrinkTimer = null;
  panel.style.transition = panel.style.transform = panel.style.opacity = "";
  panel.hidden = false;
  panel.classList.remove("settled");

  if (!cell || !cell.getBoundingClientRect) { panel.classList.add("settled"); return; }
  const r = cell.getBoundingClientRect();
  // Measured against the panel's own containing block, not the viewport, because the panel
  // covers the stage rather than the whole page.
  const base = panel.parentElement.getBoundingClientRect();
  if (!r.width || !r.height || !base.width || !base.height) { panel.classList.add("settled"); return; }

  panel.style.transition = "none";
  panel.style.transformOrigin = "0 0";
  panel.style.transform = boxTransform(r, base);
  panel.style.opacity = "1";

  // Reads a layout property to force the start transform into the computed style. Without it
  // the browser coalesces both transforms into one recalc, never holds the cell-sized frame,
  // and the panel simply appears full screen - which is what it did. The same one-line trick
  // the Daily Double splash uses two functions up.
  void panel.offsetWidth;

  panel.style.transition = "transform " + EXPAND_MS + "ms " + EASE;
  panel.style.transform = "translate(0,0) scale(1,1)";
  // Timed so the text is fully there exactly as the panel stops, rather than popping in part
  // way and then being scaled the rest of the journey.
  // Nothing to wait for when the expand itself was taken away: without this the clue screen
  // would sit blank for the 600ms the fade was meant to start at.
  setTimeout(() => panel.classList.add("settled"),
             reduced.matches ? 0 : EXPAND_MS - BODY_FADE);
}

function boxTransform(r, base) {
  return "translate(" + (r.left - base.left) + "px," + (r.top - base.top) + "px)" +
    " scale(" + (r.width / base.width) + "," + (r.height / base.height) + ")";
}

function shrinkBack(panel) {
  const parts = (shownKey || "").split("-");
  const cell = cellEls[parts[0]] && cellEls[parts[0]][parts[1]];
  panel.classList.remove("settled");
  if (!cell) { panel.hidden = true; panel.style.transform = ""; shownKey = null; return; }

  const r = cell.getBoundingClientRect();
  const base = panel.parentElement.getBoundingClientRect();
  panel.style.transition = "transform " + SHRINK_MS + "ms " + EASE +
    ", opacity " + SHRINK_MS + "ms linear";
  // Committed before the transform moves. Changing the transition and the transform in one
  // style recalc started the opacity transition and silently dropped the transform one - the
  // panel faded where it stood instead of shrinking into its cell.
  void panel.offsetWidth;
  panel.style.transform = boxTransform(r, base);
  panel.style.opacity = "0";
  shrinkTimer = setTimeout(() => {
    panel.hidden = true;
    panel.style.transition = "none";
    panel.style.transform = "";
    panel.style.opacity = "1";
    shownKey = null;
    shrinkTimer = null;
  }, SHRINK_MS + 10);
}

// A projector's size does not change mid-lesson, but a window dragged onto one does, and the
// grid is the thing the expand is measured against. Debounced, because a drag fires this many
// times a second and each one rebuilds every cell.
let resizeTimer = null;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { gridSig = ""; render(); }, 150);
});
</script>
</body>
</html>
